<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroBoy Pane</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
  >
  <style>
    :root {
      --terminal: #10141f;
      --terminal-text: #e7edf7;
      --border: #2a3142;
      --font-size: 15px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--terminal);
      color: var(--terminal-text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-size: var(--font-size);
      overflow: hidden;
    }

    .pane-window {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    .pane-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
      border-bottom: 1px solid var(--border);
      background: #151b29;
      padding: 0 10px 0 12px;
      font-weight: 400;
      text-transform: uppercase;
    }

    .pane-toolbar button,
    .pane-toolbar select,
    .input-actions button,
    .input-actions select {
      min-height: 30px;
      border: 1px solid #364156;
      border-radius: 6px;
      background: #1d2638;
      color: var(--terminal-text);
      cursor: pointer;
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 750;
    }

    .pane-toolbar select {
      min-width: 100px;
      cursor: pointer;
    }

    .pane-toolbar button.active {
      border-color: #66d9e8;
      background: #1f6f8b;
      color: #ffffff;
    }

    .input-actions select {
      min-width: 150px;
      cursor: pointer;
    }

    .pane-actions,
    .artifact-zoom-controls,
    .pane-font-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .artifact-zoom-controls[hidden] {
      display: none;
    }

    .artifact-zoom-level {
      min-width: 44px;
      text-align: center;
      color: #aab8cf;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 750;
    }

    .pane-font-level {
      min-width: 44px;
      text-align: center;
      color: #aab8cf;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 750;
    }

    .pane-body {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      min-height: 0;
      overflow: hidden;
    }

    .pane-content-surface {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .pane-tools-toggle {
      position: absolute;
      z-index: 20;
      top: 10px;
      right: 0;
      min-width: 24px;
      height: 68px;
      border: 1px solid #364156;
      border-right: 0;
      border-radius: 6px 0 0 6px;
      background: #1d2638;
      color: #c9d5e8;
      cursor: pointer;
      font: inherit;
      font-size: calc(var(--font-size) - 3px);
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
    }

    .pane-tools-open .pane-tools-toggle {
      display: none;
    }

    .pane-tools-shelf {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 210px;
      max-width: min(520px, 70vw);
      min-height: 0;
      border-left: 1px solid #364156;
      background: #151b29;
      color: var(--terminal-text);
    }

    .pane-tools-resize-handle {
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: -4px;
      width: 8px;
      cursor: col-resize;
      touch-action: none;
    }

    .pane-tools-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
      border-bottom: 1px solid #2a3142;
      padding: 0 8px 0 12px;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 800;
      text-transform: uppercase;
    }

    .pane-tools-header button {
      width: 26px;
      height: 26px;
      border: 0;
      background: transparent;
      color: #c9d5e8;
      cursor: pointer;
      font: inherit;
      font-size: 18px;
    }

    .pane-tools-content {
      min-height: 0;
      overflow: auto;
      padding: 6px;
    }

    .pane-tool-section {
      border-bottom: 1px solid #2a3142;
    }

    .pane-tool-section summary {
      cursor: pointer;
      padding: 8px 6px;
      color: #c9d5e8;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 800;
      text-transform: uppercase;
    }

    .pane-tool-section-body {
      display: grid;
      gap: 7px;
      padding: 0 6px 10px;
    }

    .pane-tool-section-body button,
    .pane-tool-section-body select,
    .pane-tool-section-body input[type="search"] {
      min-width: 0;
      min-height: 30px;
      border: 1px solid #364156;
      border-radius: 5px;
      background: #1d2638;
      color: var(--terminal-text);
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
    }

    .pane-tool-section-body button {
      cursor: pointer;
      padding: 4px 8px;
    }

    .pane-tool-section-body button.primary {
      border-color: #305e6f;
      background: #12303b;
      color: #d5f4ff;
    }

    .pane-tool-find-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px 34px;
      gap: 4px;
    }

    .pane-tool-find-row input {
      padding: 4px 7px;
    }

    .pane-tool-find-options,
    .pane-tool-button-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pane-tool-find-options {
      justify-content: space-between;
      color: #aab8cf;
      font-size: calc(var(--font-size) - 3px);
    }

    .pane-tool-button-row > * {
      flex: 1 1 0;
    }

    .pane-tool-status {
      min-height: 18px;
      color: #9fb0c8;
      font-size: calc(var(--font-size) - 3px);
    }

    .pane-tool-status.error,
    .pane-tool-find-options .error {
      color: #ffb4a9;
    }

    .terminal-host,
    .artifact-frame,
    .scratch-pad,
    .status-output,
    .input-text {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: var(--terminal);
      color: var(--terminal-text);
      font-family:
        "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: var(--font-size);
      line-height: 1.45;
      outline: none;
    }

    .terminal-host .xterm {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
    }

    .artifact-frame {
      background: var(--terminal);
      color-scheme: dark;
      opacity: 1;
      transition: opacity 80ms ease;
    }

    .artifact-frame.loading {
      opacity: 0;
    }

    .scratch-pad,
    .status-output,
    .input-text {
      padding: 10px 12px;
      resize: none;
      white-space: pre-wrap;
    }

    .status-output {
      margin: 0;
      overflow: auto;
    }

    .input-layout {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      grid-template-columns: minmax(0, 1fr) minmax(132px, 190px);
      height: 100%;
      min-height: 0;
      gap: 8px;
      padding: 8px;
    }

    .input-compose {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      gap: 8px;
    }

    .send-shortcut {
      min-width: 92px;
      min-height: 0;
      border: 1px solid #364156;
      border-radius: 8px;
      background: #1d2638;
      color: var(--terminal-text);
      cursor: crosshair;
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
      padding: 8px;
      white-space: normal;
    }

    .send-shortcut:hover,
    .send-shortcut.recording {
      border-color: #66d9e8;
      background: #183a50;
      color: #ffffff;
    }

    .send-shortcut.invalid {
      border-color: #ffb4a9;
      background: #4a242b;
    }

    .input-actions {
      display: grid;
      grid-template-rows: repeat(3, 42px);
      align-items: stretch;
      align-content: start;
      gap: 10px;
      border-left: 1px solid var(--border);
      background: #151b29;
      padding-left: 8px;
    }

    .input-actions button {
      height: 42px;
    }

    .input-actions .input-interrupt {
      border-color: #73342f;
      background: #3a1d1a;
      color: #ffb4a9;
    }

    .input-actions .input-link {
      border-color: #305e6f;
      background: #12303b;
      color: #d5f4ff;
    }

    .pane-content-control {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .pane-content-control label {
      color: #aab8cf;
      font-size: calc(var(--font-size) - 3px);
      font-weight: 750;
    }

    .pane-content-control select {
      width: clamp(130px, 22vw, 240px);
      min-width: 100px;
      min-height: 30px;
      border: 1px solid #364156;
      border-radius: 6px;
      background: #1d2638;
      color: var(--terminal-text);
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
    }

    .workspace-window {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      min-width: 0;
      min-height: 0;
    }

    .workspace-layout,
    .workspace-pane-root,
    .workspace-pane-split,
    .workspace-pane-leaf {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .workspace-layout {
      position: relative;
      overflow: hidden;
    }

    .workspace-pane-split {
      display: grid;
      overflow: hidden;
    }

    .workspace-pane-leaf {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      background: var(--terminal);
      container-type: inline-size;
    }

    .workspace-pane-toolbar {
      display: grid;
      grid-template-columns: minmax(76px, 1fr) 28px 28px 28px 28px;
      gap: 4px;
      align-items: center;
      min-width: 0;
      height: 32px;
      border-bottom: 1px solid var(--border);
      background: #151d2b;
      padding: 3px 5px;
    }

    .workspace-pane-kind {
      width: 100%;
      min-width: 0;
      height: 24px;
      border: 1px solid #364156;
      border-radius: 4px;
      background: #1d2638;
      color: var(--terminal-text);
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
      padding: 0 5px;
    }

    .workspace-pane-command {
      position: relative;
      width: 28px;
      height: 24px;
      border: 1px solid #364156;
      border-radius: 4px;
      background: #1d2638;
      color: #d8e3f4;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      line-height: 1;
    }

    .workspace-pane-command:hover:not(:disabled) {
      border-color: #4e7f9d;
      background: #22314a;
    }

    .workspace-pane-command:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .workspace-pane-command.split-right::before,
    .workspace-pane-command.split-down::before {
      position: absolute;
      inset: 5px 6px;
      border: 1px solid currentcolor;
      border-radius: 1px;
      content: "";
    }

    .workspace-pane-command.split-right::after,
    .workspace-pane-command.split-down::after {
      position: absolute;
      background: currentcolor;
      content: "";
    }

    .workspace-pane-command.split-right::after {
      top: 5px;
      bottom: 5px;
      left: 13px;
      width: 1px;
    }

    .workspace-pane-command.split-down::after {
      right: 6px;
      bottom: 11px;
      left: 6px;
      height: 1px;
    }

    .workspace-pane-empty {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      color: #77849a;
      font-size: calc(var(--font-size) - 2px);
    }

    .workspace-pane-frame {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      background: var(--terminal);
    }

    .workspace-pane-divider {
      min-width: 0;
      min-height: 0;
      background: #253044;
      touch-action: none;
    }

    .workspace-pane-divider.row {
      cursor: col-resize;
    }

    .workspace-pane-divider.column {
      cursor: row-resize;
    }

    .workspace-pane-divider:hover,
    .workspace-pane-divider.resizing {
      background: #3a78a0;
    }

    .workspace-pane-corner {
      position: absolute;
      z-index: 9;
      width: 14px;
      height: 14px;
      border: 0;
      background: transparent;
      color: #60758d;
      cursor: nesw-resize;
      touch-action: none;
    }

    .workspace-pane-corner.top-right {
      top: 32px;
      right: 0;
    }

    .workspace-pane-corner.bottom-left {
      bottom: 0;
      left: 0;
    }

    .workspace-pane-corner::before {
      position: absolute;
      width: 7px;
      height: 7px;
      content: "";
    }

    .workspace-pane-corner.top-right::before {
      top: 2px;
      right: 2px;
      border-top: 2px solid currentcolor;
      border-right: 2px solid currentcolor;
    }

    .workspace-pane-corner.bottom-left::before {
      bottom: 2px;
      left: 2px;
      border-bottom: 2px solid currentcolor;
      border-left: 2px solid currentcolor;
    }

    .workspace-pane-corner:hover,
    .workspace-pane-leaf.splitting .workspace-pane-corner {
      color: #66d9e8;
    }

    .workspace-pane-split-preview {
      position: absolute;
      z-index: 8;
      border: 2px solid #66d9e8;
      background: rgb(31 111 139 / 24%);
      pointer-events: none;
    }

    .workspace-layout.pane-layout-ctrl-ready .workspace-pane-leaf::after {
      position: absolute;
      z-index: 30;
      inset: 32px 0 0;
      background: transparent;
      content: "";
      cursor: grab;
      pointer-events: auto;
    }

    .workspace-pane-leaf.pane-drag-source {
      outline: 2px solid #f0a43c;
      outline-offset: -2px;
    }

    .workspace-pane-toolbar[data-pane-drag-handle] {
      cursor: grab;
    }

    .workspace-pane-toolbar button,
    .workspace-pane-toolbar select {
      cursor: pointer;
    }

    .pane-drag-detach-target,
    .pane-drag-preview,
    .pane-drag-ghost {
      position: fixed;
      z-index: 4000;
      pointer-events: none;
    }

    .pane-drag-detach-target {
      top: 14px;
      left: 50%;
      min-width: 180px;
      border: 2px dashed #66d9e8;
      border-radius: 6px;
      background: rgb(18 30 49 / 96%);
      color: #d8f7fb;
      padding: 10px 18px;
      text-align: center;
      transform: translateX(-50%);
    }

    .pane-drag-preview {
      border: 2px solid #66d9e8;
      background: rgb(31 111 139 / 30%);
    }

    .pane-drag-preview[data-position="center"] {
      border-color: #f0a43c;
      background: rgb(240 164 60 / 22%);
    }

    .pane-drag-ghost {
      z-index: 4003;
      max-width: 220px;
      overflow: hidden;
      border: 1px solid #52647e;
      border-radius: 4px;
      background: rgb(21 29 43 / 94%);
      color: #eef5ff;
      padding: 6px 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.pane-dragging iframe {
      pointer-events: none;
    }

    body.workspace-splitting,
    body.pane-dragging {
      user-select: none;
    }

    @container (max-width: 180px) {
      .workspace-pane-toolbar {
        grid-template-columns: minmax(42px, 1fr) 24px 24px 24px;
        gap: 2px;
      }

      .workspace-pane-command {
        width: 24px;
      }

      .workspace-pane-command.reset-layout {
        display: none;
      }
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main id="workspaceWindow" class="workspace-window" hidden>
    <header class="pane-toolbar">
      <span id="workspaceTitle">ElectroBoy workspace</span>
      <div class="pane-actions">
        <button id="resetWorkspace" type="button">Reset layout</button>
        <button id="dockWorkspace" type="button">Dock window</button>
      </div>
    </header>
    <section id="workspaceLayout" class="workspace-layout"></section>
  </main>
  <main id="directPaneWindow" class="pane-window">
    <header class="pane-toolbar">
      <span id="paneTitle">Pane</span>
      <div class="pane-actions">
        <div id="paneContentControl" class="pane-content-control" hidden>
          <label id="paneContentLabel" for="contentSwitcher">Content</label>
          <select
            id="contentSwitcher"
            aria-label="Select pane content"
            disabled
          ></select>
        </div>
        <div id="paneFontControls" class="pane-font-controls" aria-label="Pane font size">
          <button
            id="decreasePaneFont"
            type="button"
            title="Decrease pane font size"
            aria-label="Decrease pane font size"
          >A-</button>
          <span id="paneFontLevel" class="pane-font-level">15px</span>
          <button
            id="resetPaneFont"
            type="button"
            title="Reset pane font size"
            aria-label="Reset pane font size"
          >0</button>
          <button
            id="increasePaneFont"
            type="button"
            title="Increase pane font size"
            aria-label="Increase pane font size"
          >A+</button>
        </div>
        <div id="artifactZoomControls" class="artifact-zoom-controls" hidden>
          <button
            id="decreaseArtifactZoom"
            type="button"
            title="Zoom document out"
            aria-label="Zoom document out"
          >-</button>
          <span id="artifactZoomLevel" class="artifact-zoom-level">100%</span>
          <button
            id="increaseArtifactZoom"
            type="button"
            title="Zoom document in"
            aria-label="Zoom document in"
          >+</button>
        </div>
        <button
          id="refreshArtifact"
          type="button"
          title="Refresh document"
          aria-label="Refresh document"
          hidden
        >Refresh</button>
        <button
          id="previewArtifact"
          type="button"
          title="Preview document"
          aria-label="Preview document"
          hidden
        >Preview</button>
        <button
          id="editArtifact"
          type="button"
          title="Edit document"
          aria-label="Edit document"
          hidden
        >Edit</button>
        <select
          id="exportPaneFormat"
          title="Export format"
          aria-label="Export format"
          hidden
        >
          <option value="markdown">Markdown</option>
          <option value="docx">DOCX</option>
          <option value="pdf">PDF</option>
        </select>
        <button
          id="exportPaneOutput"
          type="button"
          title="Export pane output or document"
          aria-label="Export pane output or document"
          hidden
        >Export</button>
        <button id="dockPane" type="button">Dock</button>
      </div>
    </header>
    <section id="paneBody" class="pane-body">
      <div id="paneContentSurface" class="pane-content-surface">
        <div id="terminalHost" class="terminal-host" hidden></div>
      <iframe
        id="artifactFrame"
        class="artifact-frame"
        title="Rendered file preview"
        sandbox="allow-scripts allow-popups allow-modals allow-same-origin"
        hidden
      ></iframe>
      <textarea id="scratchPad" class="scratch-pad" spellcheck="true" hidden></textarea>
      <pre id="statusOutput" class="status-output" hidden></pre>
        <div id="inputLayout" class="input-layout" hidden>
          <div class="input-compose">
            <textarea id="agentInput" class="input-text" spellcheck="true"></textarea>
          </div>
          <div class="input-actions">
            <button id="interruptAgent" class="input-interrupt" type="button">
              Interrupt
            </button>
            <button id="linkAgentFile" class="input-link" type="button">
              Link file
            </button>
            <button
              id="agentSendShortcut"
              class="send-shortcut"
              type="button"
              title="Hover to record the send-message shortcut"
              aria-label="Hover to record the send-message shortcut"
            >Shift+Enter</button>
          </div>
        </div>
      </div>
      <button
        id="paneToolsToggle"
        class="pane-tools-toggle"
        type="button"
        aria-controls="paneToolsShelf"
        aria-expanded="false"
        hidden
      >Tools</button>
      <aside id="paneToolsShelf" class="pane-tools-shelf" aria-label="Pane tools" hidden>
        <div id="paneToolsResizeHandle" class="pane-tools-resize-handle"></div>
        <header class="pane-tools-header">
          <span>Tools</span>
          <button id="closePaneTools" type="button" aria-label="Close pane tools">×</button>
        </header>
        <div id="paneToolsContent" class="pane-tools-content"></div>
      </aside>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="/assets/service/js/core/pane-layout-drag.js"></script>
  <script src="/assets/service/js/core/pane-workspace.js"></script>
  <script src="/assets/service/js/core/input-shortcut.js"></script>
  <script src="/assets/service/js/core/pane-sync.js"></script>
  <script src="/assets/service/js/core/pane-tools.js"></script>
  <script src="/assets/service/js/modules/file-pane-tools.js"></script>
  <script>
    const PANE_KIND = __PANE_KIND__;
    const params = new URLSearchParams(window.location.search);
    const EMBEDDED_PANE = params.get("embedded") === "1";
    const contextId = params.get("context_id") || "";
    let selectedSessionId = params.get("session_id") || "";

    applyFontSize();

    function paneFontKeyForKind(kind) {
      if (kind === "shell") return "shell";
      if (kind === "progress") return "progress";
      if (kind === "input") return "input";
      if (kind === "scratch") return "scratch";
      if (kind === "status") return "status";
      return "agent";
    }

    function storedBaseFontSize() {
      const requested = Number(
        params.get("base_font_size") || params.get("font_size") || "",
      );
      if (Number.isFinite(requested) && requested > 0) {
        return clampFontSize(requested);
      }
      try {
        const stored = Number(window.localStorage.getItem(TERMINAL_FONT_STORAGE_KEY));
        if (Number.isFinite(stored) && stored > 0) {
          return clampFontSize(stored);
        }
      } catch (error) {
        return DEFAULT_FONT_SIZE;
      }
      return DEFAULT_FONT_SIZE;
    }

    function storedFontOffset() {
      if (params.has("font_offset")) {
        const requested = Number(params.get("font_offset") || "");
        if (Number.isFinite(requested)) {
          return clampFontOffset(requested);
        }
      }
      return localStoredFontOffset();
    }

    function localStoredFontOffset() {
      try {
        const stored = Number(
          window.localStorage.getItem(PANE_FONT_OFFSET_STORAGE_PREFIX + fontPane),
        );
        if (Number.isFinite(stored)) {
          return clampFontOffset(stored);
        }
      } catch (error) {
        return 0;
      }
      return 0;
    }

    function clampFontSize(value) {
      return Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, Math.round(value)));
    }

    function clampFontOffset(value) {
      return Math.max(MIN_FONT_OFFSET, Math.min(MAX_FONT_OFFSET, Math.round(value)));
    }

    function effectiveFontSize() {
      return clampFontSize(baseFontSize + fontOffset);
    }

    function saveFontOffset() {
      try {
        window.localStorage.setItem(
          PANE_FONT_OFFSET_STORAGE_PREFIX + fontPane,
          String(fontOffset),
        );
      } catch (error) {
        return;
      }
    }

    function notifyFontOffsetChanged() {
      if (window.opener) {
        window.opener.postMessage(
          {
            type: "electroboy-pane-font-offset",
            pane: fontPane,
            offset: fontOffset,
          },
          window.location.origin,
        );
      }
    }

    function applyFontSize() {
      fontSize = effectiveFontSize();
      document.documentElement.style.setProperty("--font-size", `${fontSize}px`);
      if (terminal) {
        terminal.options.fontSize = fontSize;
        window.requestAnimationFrame(fitTerminal);
      }
      paneFontControls.hidden = PANE_KIND === "artifact";
      paneFontLevel.textContent = `${fontSize}px`;
      paneFontLevel.title = fontOffset === 0
        ? "Global font size"
        : `Global ${fontOffset > 0 ? "+" : ""}${fontOffset}px`;
      decreasePaneFont.disabled = fontOffset <= MIN_FONT_OFFSET;
      resetPaneFont.disabled = fontOffset === 0;
      increasePaneFont.disabled = fontOffset >= MAX_FONT_OFFSET;
    }

    function changeFontSize(delta) {
      fontOffset = clampFontOffset(fontOffset + delta);
      saveFontOffset();
      applyFontSize();
      notifyFontOffsetChanged();
    }

    function resetFontSize() {
      fontOffset = 0;
      saveFontOffset();
      applyFontSize();
      notifyFontOffsetChanged();
    }

    function titleForPane(kind) {
      if (kind === "agent") return "Agent output";
      if (kind === "artifact") {
        return "File";
      }
      if (kind === "progress") return "Progress";
      if (kind === "scratch") return "Scratch pad";
      if (kind === "status") return "Project status";
      if (kind === "input") return "AI agent input";
      if (kind === "shell") return "Project shell";
      return "Pane";
    }

    function contextUrl(path) {
      const separator = path.includes("?") ? "&" : "?";
      return `${path}${separator}context_id=${encodeURIComponent(contextId)}`;
    }

    function shellContextUrl(path) {
      const url = new URL(contextUrl(path), window.location.origin);
      if (selectedShellSessionId) {
        url.searchParams.set("session_id", selectedShellSessionId);
      }
      return `${url.pathname}${url.search}`;
    }

    function renderSessionSwitcher() {
      contentSwitcher.replaceChildren();
      const visibleSessions = agentSessions.filter(
        (session) => session.status === "running" || session.session_id === selectedSessionId,
      );
      if (visibleSessions.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No active agents";
        contentSwitcher.append(option);
        contentSwitcher.disabled = true;
        return;
      }
      for (const session of visibleSessions) {
        const option = document.createElement("option");
        option.value = session.session_id;
        const status = session.status === "running" ? "running" : session.status || "done";
        option.textContent = `${session.kind || "agent"} · ${status}`;
        contentSwitcher.append(option);
      }
      if (!agentSessions.some((session) => session.session_id === selectedSessionId)) {
        const selected = visibleSessions.find((session) => session.selected) || visibleSessions[0];
        selectedSessionId = selected ? selected.session_id : "";
      }
      contentSwitcher.value = selectedSessionId;
      contentSwitcher.disabled = false;
    }

    function renderFileSwitcher() {
      contentSwitcher.replaceChildren();
      const files = [...openFileTargets];
      if (
        artifactKind === "document"
        && artifactDocumentPath
        && !files.some((file) => file.path === artifactDocumentPath)
      ) {
        files.unshift({
          path: artifactDocumentPath,
          label: artifactDocumentTitle || artifactDocumentPath,
        });
      }
      if (files.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No open files";
        contentSwitcher.append(option);
        contentSwitcher.disabled = true;
        return;
      }
      files.forEach((file) => {
        const option = document.createElement("option");
        option.value = file.path;
        option.textContent = file.label || file.path;
        contentSwitcher.append(option);
      });
      contentSwitcher.value = artifactDocumentPath;
      contentSwitcher.disabled = false;
      if (!contentSwitcher.value) {
        selectFileTarget(files[0]);
      }
    }

    function selectFileTarget(target) {
      if (!target || !target.path) {
        return;
      }
      artifactKind = "document";
      artifactDocumentPath = target.path;
      artifactDocumentTitle = target.label || target.path;
      artifactRoutePath = "";
      artifactRouteTitle = "";
      artifactEditing = false;
      contentSwitcher.value = artifactDocumentPath;
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("artifact", "document");
      nextUrl.searchParams.set("document_path", artifactDocumentPath);
      nextUrl.searchParams.set("document_title", artifactDocumentTitle);
      nextUrl.searchParams.delete("artifact_path");
      nextUrl.searchParams.delete("artifact_title");
      window.history.replaceState(null, "", nextUrl);
      if (artifactEventSource) {
        artifactEventSource.close();
        artifactEventSource = null;
      }
      connectArtifactStream();
      if (filePaneTools) filePaneTools.refresh();
    }

    function shellSessionLabel(session) {
      const status = session.status === "running" ? "running" : session.status || "done";
      const name = session.label || "Shell";
      return `${name} · ${status} · ${String(session.session_id || "").slice(0, 6)}`;
    }

    function renderShellSwitcher() {
      contentSwitcher.replaceChildren();
      const visibleSessions = shellSessions.filter(
        (session) => session.status === "running" || session.session_id === selectedShellSessionId,
      );
      if (visibleSessions.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No active shells";
        contentSwitcher.append(option);
        contentSwitcher.disabled = true;
        return;
      }
      visibleSessions.forEach((session) => {
        const option = document.createElement("option");
        option.value = session.session_id;
        option.textContent = shellSessionLabel(session);
        contentSwitcher.append(option);
      });
      if (!visibleSessions.some((session) => session.session_id === selectedShellSessionId)) {
        selectedShellSessionId = visibleSessions[0].session_id;
      }
      contentSwitcher.value = selectedShellSessionId;
      contentSwitcher.disabled = false;
    }

    async function refreshShellSessions() {
      const response = await fetch(contextUrl("/api/shell/sessions"), {
        cache: "no-store",
      });
      const payload = await response.json().catch(() => ({ sessions: [] }));
      if (!response.ok) {
        return;
      }
      shellSessions = Array.isArray(payload.sessions) ? payload.sessions : [];
      const previousSessionId = selectedShellSessionId;
      renderShellSwitcher();
      if (selectedShellSessionId && selectedShellSessionId !== previousSessionId) {
        const nextSessionId = selectedShellSessionId;
        selectedShellSessionId = previousSessionId;
        selectShellSession(nextSessionId);
      }
    }

    function selectShellSession(sessionId) {
      if (!sessionId || sessionId === selectedShellSessionId) {
        return;
      }
      selectedShellSessionId = sessionId;
      contentSwitcher.value = selectedShellSessionId;
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("shell_session_id", selectedShellSessionId);
      window.history.replaceState(null, "", nextUrl);
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      if (terminal) {
        terminal.clear();
      }
      connectShellStream();
    }

    function initializeContentSwitcher() {
      if (PANE_KIND === "agent" || PANE_KIND === "input") {
        paneContentControl.hidden = false;
        paneContentLabel.textContent = "Agent";
        contentRefreshTimer = window.setInterval(
          () => refreshSessions().catch(() => {}),
          3000,
        );
        return;
      }
      if (PANE_KIND === "artifact") {
        paneContentControl.hidden = false;
        paneContentLabel.textContent = "File";
        if (artifactKind === "document" && artifactDocumentPath) {
          openFileTargets = [{
            path: artifactDocumentPath,
            label: artifactDocumentTitle || artifactDocumentPath,
          }];
        }
        renderFileSwitcher();
        contentCatalogSync = window.ElectroBoyPaneSync.connect({
          pane: "file-catalog",
          context: () => contextId,
          priority: 10,
          snapshot: () => ({ files: openFileTargets }),
          receive: (state) => {
            if (!state || !Array.isArray(state.files)) {
              return;
            }
            openFileTargets = state.files
              .map((file) => ({
                path: String(file.path || ""),
                label: String(file.label || file.path || ""),
              }))
              .filter((file) => file.path);
            renderFileSwitcher();
          },
        });
        return;
      }
      if (PANE_KIND === "shell") {
        paneContentControl.hidden = false;
        paneContentLabel.textContent = "Shell";
        refreshShellSessions().catch(() => {});
        contentRefreshTimer = window.setInterval(
          () => refreshShellSessions().catch(() => {}),
          3000,
        );
      }
    }

    async function refreshSessions() {
      if (!contextId) {
        renderSessionSwitcher();
        return;
      }
      const response = await fetch(contextUrl("/api/project"), { cache: "no-store" });
      const payload = await response.json().catch(() => ({ error: "project load failed" }));
      if (!response.ok) {
        renderSessionSwitcher();
        return;
      }
      agentSessions = Array.isArray(payload.sessions) ? payload.sessions : [];
      activeProjectRoot = payload.active_project_root || payload.activation_root
        || payload.service_root || "";
      if (!agentSessions.some((session) => session.session_id === selectedSessionId)) {
        selectedSessionId = payload.selected_session_id || "";
      }
      renderSessionSwitcher();
    }

    async function selectAgentSession(sessionId) {
      if (!sessionId || sessionId === selectedSessionId) {
        return;
      }
      if (PANE_KIND === "agent") {
        selectedSessionId = sessionId;
        renderSessionSwitcher();
        connectAgentStream();
        return;
      }
      const response = await fetch(contextUrl("/api/sessions/select"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId }),
      });
      const payload = await response.json().catch(() => ({ error: "session switch failed" }));
      if (!response.ok) {
        renderSessionSwitcher();
        return;
      }
      agentSessions = Array.isArray(payload.sessions) ? payload.sessions : agentSessions;
      selectedSessionId = payload.selected_session_id || sessionId;
      renderSessionSwitcher();
      if (PANE_KIND === "input") {
        agentInput.focus();
      }
      if (PANE_KIND === "agent") {
        connectAgentStream();
      }
    }

    function publishSharedPaneState(state) {
      if (sharedPaneSync && sharedPaneSync.available) {
        sharedPaneSync.publish(state);
      }
    }

    function agentInputState() {
      return {
        sessionId: selectedSessionId || "",
        value: agentInput.value,
      };
    }

    function publishAgentInputState() {
      publishSharedPaneState(agentInputState());
    }

    async function applySharedAgentInputState(state) {
      if (!state || typeof state.value !== "string") {
        return;
      }
      const sessionId = String(state.sessionId || "");
      const previousSessionId = selectedSessionId || "";
      if (previousSessionId) {
        agentInputDrafts.set(previousSessionId, agentInput.value);
      }
      if (sessionId && sessionId !== previousSessionId) {
        await selectAgentSession(sessionId);
      }
      if (sessionId) {
        agentInputDrafts.set(sessionId, state.value);
      }
      agentInput.value = state.value;
    }

    async function selectAgentInputSession(sessionId) {
      const previousSessionId = selectedSessionId || "";
      if (previousSessionId) {
        agentInputDrafts.set(previousSessionId, agentInput.value);
      }
      await selectAgentSession(sessionId);
      agentInput.value = agentInputDrafts.get(sessionId) || "";
      publishAgentInputState();
    }

    function renderSharedProgressState(state, publish = false) {
      if (!terminal || !state || !Array.isArray(state.entries)) {
        return;
      }
      latestProgressState = {
        entries: state.entries.map((entry) => ({
          text: String(entry.text || ""),
          className: entry.className || "",
        })),
      };
      terminal.clear();
      latestProgressState.entries.forEach((entry) => {
        terminal.write(formatTerminalMessage(entry.text, entry.className));
      });
      if (publish) {
        publishSharedPaneState(latestProgressState);
      }
    }

    function setSharedStatusText(text, publish = false) {
      lastSharedStatusText = String(text || "");
      statusOutput.textContent = lastSharedStatusText;
      if (publish) {
        publishSharedPaneState({ text: lastSharedStatusText });
      }
    }

    function initializeSharedPaneSync() {
      if (!["scratch", "progress", "status", "input"].includes(PANE_KIND)) {
        return;
      }
      sharedPaneSync = window.ElectroBoyPaneSync.connect({
        pane: PANE_KIND,
        context: () => contextId,
        priority: 10,
        snapshot: () => {
          if (PANE_KIND === "scratch") return { value: scratchPad.value };
          if (PANE_KIND === "progress") return latestProgressState;
          if (PANE_KIND === "status") return { text: statusOutput.textContent };
          return agentInputState();
        },
        receive: (state) => {
          if (PANE_KIND === "scratch" && state && typeof state.value === "string") {
            scratchPad.value = state.value;
            const storageKey = scratchPadStorageKey();
            if (storageKey) {
              try {
                window.localStorage.setItem(storageKey, state.value);
              } catch (error) {
                // The live view remains synchronized when storage is unavailable.
              }
            }
          } else if (PANE_KIND === "progress") {
            renderSharedProgressState(state);
          } else if (PANE_KIND === "status" && state && typeof state.text === "string") {
            setSharedStatusText(state.text);
          } else if (PANE_KIND === "input") {
            inputSyncQueue = inputSyncQueue
              .catch(() => {})
              .then(() => applySharedAgentInputState(state))
              .catch(() => {});
          }
        },
      });
    }

    function clampArtifactZoom(value) {
      if (!Number.isFinite(value)) {
        return 100;
      }
      const stepped = Math.round(value / ARTIFACT_ZOOM_STEP) * ARTIFACT_ZOOM_STEP;
      return Math.max(MIN_ARTIFACT_ZOOM, Math.min(MAX_ARTIFACT_ZOOM, stepped));
    }

    function applyArtifactZoom() {
      artifactZoomLevel.textContent = `${artifactZoom}%`;
      decreaseArtifactZoom.disabled = artifactZoom <= MIN_ARTIFACT_ZOOM;
      increaseArtifactZoom.disabled = artifactZoom >= MAX_ARTIFACT_ZOOM;
    }

    function changeArtifactZoom(delta) {
      artifactZoom = clampArtifactZoom(artifactZoom + delta);
      applyArtifactZoom();
      if (artifactEditing) {
        postArtifactEditorFontSize();
        return;
      }
      refreshArtifact();
    }

    function artifactEditorFontSize() {
      return Math.max(11, Math.min(28, Math.round(16 * (artifactZoom / 100))));
    }

    function postArtifactEditorFontSize() {
      if (!artifactEditing || !artifactFrame.contentWindow) {
        return;
      }
      artifactFrame.contentWindow.postMessage(
        {
          type: "electroboy-editor-font-size",
          font_size: artifactEditorFontSize(),
        },
        window.location.origin,
      );
    }

          green: "#51cf66",
          yellow: "#ffd43b",
          blue: "#74c0fc",
          magenta: "#da77f2",
          cyan: "#66d9e8",
          white: "#f1f3f5",
          brightBlack: "#5c677d",
          brightRed: "#ff8787",
          brightGreen: "#69db7c",
          brightYellow: "#ffe066",
          brightBlue: "#91caff",
          brightMagenta: "#e599f7",

    function reportPaneError(message) {
      if (terminal) {
        terminal.write(formatTerminalMessage(`${message}\r\n`, "error"));
        return;

      window.alert(message);

    function timestampForDownload() {
      return new Date().toISOString().replace(/[:.]/g, "-");
    }

    function exportSafeName(value, fallback = "export") {
      return String(value || fallback)
        .replace(/[^A-Za-z0-9._-]+/g, "-")
        .replace(/^-+|-+$/g, "")
        || fallback;
    }

    function documentExportFormats() {
      return [
        {
          value: "markdown",
          label: "Markdown",
          extension: "md",
          description: "Markdown",
          accept: {
            "text/markdown": [".md"],
            "text/plain": [".txt"],
          },
        },
        {
          value: "docx",
          label: "DOCX",
          extension: "docx",
          description: "Word document",
          accept: {
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document": [
              ".docx",
            ],
          },
        },
        {
          value: "pdf",
          label: "PDF",
          extension: "pdf",
          description: "PDF",
          accept: {
            "application/pdf": [".pdf"],
          },
        },
      ];
    }

    function documentExportFormat(format) {
      return documentExportFormats().find((candidate) => candidate.value === format)
        || documentExportFormats()[0];
    }

    function documentExportPickerTypes(format = "markdown") {
      const selected = documentExportFormat(format);
      return [
        {
          description: selected.description,
          accept: selected.accept,
        },
      ];
    }

    function downloadBlob(fileName, blob) {
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.append(link);
      link.click();
      link.remove();

    async function writeBlobWithPicker(
      blob,
      suggestedName,
      pickerTypes = documentExportPickerTypes("markdown"),
    ) {
      if (!window.showSaveFilePicker) {
        downloadBlob(suggestedName, blob);
        return;
      }
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: pickerTypes,
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
      } catch (error) {
        if (error && error.name === "AbortError") {
          return;
        }
        reportPaneError(`export picker failed: ${error}`);
        downloadBlob(suggestedName, blob);
      }
    }

    async function exportBlob(url, suggestedName, format = "markdown") {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        const message = await response.text();
        reportPaneError(message || "export failed");
        return;
      }
      const blob = await response.blob();
      await writeBlobWithPicker(
        blob,
        suggestedName,
        documentExportPickerTypes(format),
      );
    }

    function showTerminal(disableStdin = true, onData = null) {
      terminalHost.hidden = false;

          queueShellResize(cols, rows);
        } else if (PANE_KIND === "agent") {

    function fitTerminal() {
      if (!terminalFit) {

        window.requestAnimationFrame(() => queueShellResize());

    function observeTerminalPaneResize() {
      if (!window.ResizeObserver || terminalResizeObserver) {

    function formatTerminalMessage(text, type) {
      if (type === "error") return `\x1b[31m${text}\x1b[0m`;
      if (type === "system") return `\x1b[36m${text}\x1b[0m`;
      return text;
    }

    function connectAgentStream() {
      showTerminal();
      if (!contextId || !selectedSessionId) {
        terminal.write("\x1b[31mno selected stream\x1b[0m\r\n");
        return;
      }
      if (eventSource) {
        eventSource.close();
      }
      eventSource = new EventSource(
        contextUrl(
          `/api/sessions/events?session_id=${encodeURIComponent(selectedSessionId)}`,
        ),
      );
      eventSource.addEventListener("agent-event", (event) => {
        const payload = JSON.parse(event.data);
        if (payload.type === "output") {
          terminal.write(payload.terminal || payload.text || "");
        } else if (payload.type === "system" || payload.type === "error") {
          terminal.write(formatTerminalMessage(`${payload.text}\r\n`, payload.type));
        } else if (payload.type === "completed") {
          terminal.write(formatTerminalMessage(
            `\r\nprocess exited with code ${payload.returncode}\r\n`,
            "system",
          ));
        }
      });
      eventSource.onerror = () => {};
    }

    function connectProgressStream() {
      showTerminal();
      if (!contextId) {
        terminal.write("\x1b[31mno active context\x1b[0m\r\n");
        return;
      }
      eventSource = new EventSource(contextUrl("/api/progress/events"));
      eventSource.addEventListener("progress-event", (event) => {
        const payload = JSON.parse(event.data);
        renderSharedProgressState({
          entries: [{
            text: payload.text || "",
            className: payload.type === "error" ? "error" : "",
          }],
        }, true);
        if (payload.running === false) {
          eventSource.close();
        }
      });
      eventSource.onerror = () => {};
    }

    function connectShellStream() {

      eventSource.addEventListener("agent-event", (event) => {

        } else if (payload.type === "system" || payload.type === "error") {
          terminal.write(formatTerminalMessage(`${payload.text}\r\n`, payload.type));
        } else if (payload.type === "completed") {
          terminal.write(formatTerminalMessage(
            `\r\nproject shell exited with code ${payload.returncode}\r\n`,
            "system",

        }
      });
      eventSource.onerror = () => {};
      window.requestAnimationFrame(sendShellResize);
    }

    function printableInputEvent(event) {
      return (
        !event.altKey &&
        !event.ctrlKey &&
        !event.metaKey &&
        event.key &&
        event.key.length === 1
      );
    }

    function slashCommandTerminalKeyForInputEvent(event) {
      if (event.altKey || event.ctrlKey || event.metaKey) {
        return "";
      }
      if (
        event.key === "Enter" ||
        event.code === "Enter" ||
        event.code === "NumpadEnter"
      ) {
        return "enter";
      }
      if (event.key === "Escape") return "escape";
      if (event.key === "ArrowUp") return "up";
      if (event.key === "ArrowDown") return "down";
      if (event.key === "ArrowLeft") return "left";
      if (event.key === "ArrowRight") return "right";
      if (event.key === "Backspace") return "backspace";
      if (event.key === "Delete") return "delete";
      if (event.key === "Tab") return "tab";
      return "";
    }

    function refreshSlashCommandModeAfterEdit() {
      window.setTimeout(() => {
        if (!agentInput.value.trimStart().startsWith("/")) {
          slashCommandMode = false;
        }
      }, 0);
    }

    function finishSlashCommandMode() {
      slashCommandMode = false;
      agentInput.value = "";
      publishAgentInputState();
    }

    function handleSlashCommandInput(event) {
      if (
        !slashCommandMode &&
        printableInputEvent(event) &&
        event.key === "/" &&
        agentInput.value.trim().length === 0
      ) {
        slashCommandMode = true;
        sendTerminalRaw(event.key);
        return true;
      }
      if (!slashCommandMode) {
        return false;
      }
      const slashKey = slashCommandTerminalKeyForInputEvent(event);
      if (slashKey) {
        sendTerminalKey(slashKey);
        if (slashKey === "enter" || slashKey === "escape") {
          event.preventDefault();
          finishSlashCommandMode();
        } else if (slashKey === "backspace" || slashKey === "delete") {
          refreshSlashCommandModeAfterEdit();
        } else {
          event.preventDefault();
        }
        return true;
      }
      if (printableInputEvent(event)) {
        sendTerminalRaw(event.key);
        return true;
      }
      return false;
    }

    function terminalKeyForInputEvent(event) {
      if (
        !event.altKey &&
        !event.ctrlKey &&
        !event.metaKey &&
        !event.shiftKey &&
        event.key === "Escape"
      ) {
        return "escape";
      }
      if (agentInput.value.length > 0) {
        return "";
      }
      if (
        event.ctrlKey &&
        !event.altKey &&
        !event.metaKey &&
        !event.shiftKey &&
        /^[0-9]$/.test(event.key)
      ) {
        return event.key;
      }
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) {
        return "";
      }
      if (
        event.key === "Enter" ||
        event.code === "Enter" ||
        event.code === "NumpadEnter"
      ) {
        return "enter";
      }
      if (event.key === "ArrowUp") return "up";
      if (event.key === "ArrowDown") return "down";
      if (event.key === "ArrowLeft") return "left";
      if (event.key === "ArrowRight") return "right";
      if (event.key === "Tab") return "tab";
      return "";
    }

    function insertTextAtCursor(text) {
      const start = agentInput.selectionStart ?? agentInput.value.length;
      const end = agentInput.selectionEnd ?? start;
      const prefix = start > 0 && !/\s$/.test(agentInput.value.slice(0, start)) ? " " : "";
      const suffix = end < agentInput.value.length && !/^\s/.test(agentInput.value.slice(end))

      agentInput.setRangeText(`${prefix}${text}${suffix}`, start, end, "end");
      publishAgentInputState();
      agentInput.focus();

        scratchPad.value = event.newValue || "";
        if (document.activeElement === scratchPad) {
          const length = scratchPad.value.length;
          scratchPad.setSelectionRange(
            Math.min(selectionStart, length),
            Math.min(selectionEnd, length),
          );
        }
        return;
      }
      if (event.key === TERMINAL_FONT_STORAGE_KEY) {
        const nextBase = Number(event.newValue || "");
        if (Number.isFinite(nextBase) && nextBase > 0) {
          baseFontSize = clampFontSize(nextBase);
          applyFontSize();
        }
        return;
      }
      if (event.key !== PANE_FONT_OFFSET_STORAGE_PREFIX + fontPane) {
        return;
      }
      fontOffset = localStoredFontOffset();
      applyFontSize();
    });
    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) {
        return;
      }
      const data = event.data || {};
      if (
        data.type === "electroboy-file-browser-select" &&
        data.mode === "link" &&
        data.path
      ) {
        insertTextAtCursor(String(data.path));
        return;
      }
      if (data.type === "electroboy-artifact-saved") {
        artifactVersion += 1;
        if (!artifactEditing) {
          refreshArtifact();
        }
      }
    });
    contentSwitcher.addEventListener("change", () => {
      if (PANE_KIND === "input") {
        selectAgentInputSession(contentSwitcher.value).catch(() => {});
      } else if (PANE_KIND === "agent") {
        selectAgentSession(contentSwitcher.value);
      } else if (PANE_KIND === "artifact") {
        selectFileTarget(
          openFileTargets.find((file) => file.path === contentSwitcher.value),
        );
      } else if (PANE_KIND === "shell") {
        selectShellSession(contentSwitcher.value);
      }
    });
    interruptAgent.addEventListener("click", interruptAgentSession);
    linkAgentFile.addEventListener("click", openLinkFileBrowser);
    agentInput.addEventListener("keydown", (event) => {
      if (handleSlashCommandInput(event)) {
        return;
      }
      if (shortcutController.matches(event)) {
        event.preventDefault();
        if (agentInput.value.trim()) {
          sendMessage();
        } else {
          sendTerminalKey("enter");
        }
        return;
      }
      const terminalKey = terminalKeyForInputEvent(event);
      if (terminalKey) {
        event.preventDefault();
        sendTerminalKey(terminalKey);
        return;
      }
    });
    agentInput.addEventListener("input", () => {
      if (PANE_KIND !== "input") {
        return;
      }
      if (selectedSessionId) {
        agentInputDrafts.set(selectedSessionId, agentInput.value);
      }
      publishAgentInputState();
    });

    paneToolsController = window.ElectroBoyPaneTools.create({
      host: paneBody,
      shelf: paneToolsShelf,
      content: paneToolsContent,
      toggleButton: paneToolsToggle,
      closeButton: closePaneTools,
      resizeHandle: paneToolsResizeHandle,
      storageKey: `electroboy.paneTools.${contextId}.${PANE_KIND}`,
      onResize: fitTerminal,
    });
    if (PANE_KIND === "artifact" && window.ElectroBoyFilePaneTools) {
      filePaneTools = window.ElectroBoyFilePaneTools.mount({
        controller: paneToolsController,
        frame: artifactFrame,
        contextUrl,
        getTarget: () => ({
          kind: artifactKind,
          path: artifactDocumentPath || artifactRoutePath,
          title: artifactDocumentTitle || artifactRouteTitle,
        }),
        controls: {
          zoom: artifactZoomControls,
          preview: previewArtifactButton,
          edit: editArtifactButton,
          refresh: refreshArtifactButton,
          exportFormat: exportPaneFormat,
          exportButton: exportPaneOutput,
        },
      });
    }

    paneTitle.textContent = titleForPane(PANE_KIND);
    initializeContentSwitcher();
    exportPaneFormat.hidden = PANE_KIND !== "artifact";
    exportPaneOutput.hidden = !canExportPaneOutput();
    if (PANE_KIND === "agent") {
      refreshSessions().catch(() => {}).then(connectAgentStream);
    }
    else if (PANE_KIND === "progress") connectProgressStream();
    else if (PANE_KIND === "artifact") connectArtifactStream();
    else if (PANE_KIND === "scratch") showScratchPad();
    else if (PANE_KIND === "status") showStatus();
    else if (PANE_KIND === "input") showInput();
    else if (PANE_KIND === "shell") connectShellStream();

    window.addEventListener("beforeunload", () => {
      stopDisposableShell();
      if (sharedPaneSync) sharedPaneSync.close();
      if (contentCatalogSync) contentCatalogSync.close();
      if (eventSource) eventSource.close();
      if (artifactEventSource) artifactEventSource.close();
      if (statusTimer) window.clearInterval(statusTimer);
      if (contentRefreshTimer) window.clearInterval(contentRefreshTimer);
    });
    }

    if (EMBEDDED_PANE) {
      initializeDirectPane();
    } else {
      initializePaneWorkspace();
    }
  </script>
</body>
</html>
