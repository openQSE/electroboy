      if (artifactKind === "requirements") {
        return "Requirements";
      }
      if (artifactKind === "empty") {
        return "No file open";
      }
      return "";
    }

    function selectFileTarget(target) {
      if (!target || !target.path) {
        return;
      }
      const existingIndex = openFileTargets.findIndex(
        (file) => file.path === target.path,
      );
      const storedTarget = {
        path: target.path,
        label: target.label || target.path,
      };
      if (existingIndex >= 0) {
        openFileTargets.splice(existingIndex, 1, storedTarget);
      } else {
        openFileTargets.push(storedTarget);
      }
      artifactKind = "document";
      artifactDocumentPath = target.path;
      artifactDocumentTitle = target.label || target.path;
      artifactRoutePath = "";
      artifactRouteTitle = "";
      artifactEditing = false;
      syncArtifactUrlState();
      renderFileSwitcher();
      notifyPaneArtifactChange({
        id: `document:${artifactDocumentPath}`,
        kind: "document",
        title: artifactDocumentTitle,
        target: {
          path: artifactDocumentPath,
          label: artifactDocumentTitle,
        },
      });
      contentCatalogSync?.publish({ files: openFileTargets });
      reconnectArtifactStream();
    }

    function notifyPaneArtifactChange(item) {
      if (EMBEDDED_PANE && paneInstanceId && window.parent !== window) {
        window.parent.postMessage(
          {
            type: "electroboy:pane-artifact-change",
            paneInstanceId,
            item,
          },
          window.location.origin,
        );
      }
    }

    function notifyPaneAgentSessionChange() {
      if (
        PANE_KIND !== "agent" ||
        !EMBEDDED_PANE ||
        !paneInstanceId ||
        !selectedSessionId ||
        window.parent === window
      ) {
        return;
      }
      window.parent.postMessage(
        {
          type: "electroboy:pane-agent-session-change",
          paneInstanceId,
          sessionId: selectedSessionId,
        },
        window.location.origin,
      );
    }

    function documentActionOwner() {
      try {
        if (window.top !== window && window.top.opener && !window.top.opener.closed) {
          return window.top.opener;
        }
      } catch (error) {
        // Cross-origin ancestors cannot expose their opener.
      }
      if (window.opener && !window.opener.closed) {
        return window.opener;
      }
      return window.parent !== window ? window.parent : null;
    }

    function postDocumentFileAction(action, target) {
      documentActionOwner()?.postMessage(
        {
          type: "electroboy:document-file-action",
          action,
          target,
        },
        window.location.origin,
      );
    }

    function paneDocumentTargetFromSelectedPath(path) {
      const selected = String(path || "").trim();
      const root = String(activeProjectRoot || "").replace(/\/+$/, "");
      if (!selected) {
        return null;
      }
      let relativePath = selected;
      if (root && selected.startsWith(`${root}/`)) {
        relativePath = selected.slice(root.length + 1);
      }
      if (relativePath.startsWith("/")) {
        throw new Error(`document must be under the active project: ${selected}`);
      }
      const label = relativePath.replace(/\.md$/i, "") || relativePath;
      return { path: relativePath, label };
    }

    async function openPaneDocumentFileBrowser(mode) {
      const popup = window.open(
        "",
        mode === "document-new"
          ? "electroboy-new-document-browser"
          : "electroboy-document-browser",
        "popup=yes,width=980,height=720,scrollbars=yes,resizable=yes",
      );
      if (!popup) {
        throw new Error("popup was blocked by the browser");
      }
      try {
        const project = await loadProjectPayload();
        activeProjectRoot = project.active_project_root || project.activation_root || "";
        if (!activeProjectRoot) {
          throw new Error("activate a project first");
        }
        const parameters = new URLSearchParams({
          path: activeProjectRoot,
          mode,
        });
        popup.location.replace(`/file-browser?${parameters.toString()}`);
      } catch (error) {
        popup.close();
        throw error;
      }
    }

    function popOutCurrentArtifact() {
      if (artifactKind === "empty") {
        return;
      }
      const popupUrl = new URL(window.location.href);
      popupUrl.searchParams.delete("embedded");
      popupUrl.searchParams.delete("pane_instance_id");
      popupUrl.searchParams.set("popped", "1");
      const popup = window.open(
        `${popupUrl.pathname}${popupUrl.search}`,
        `electroboy-artifact-${artifactTargetPath() || artifactKind}-${contextId}`,
        "popup=yes,width=980,height=720,menubar=no,toolbar=no,location=no,"
          + "status=no,scrollbars=yes,resizable=yes",
      );
      if (!popup) {
        throw new Error("popup was blocked by the browser");
      }
    }

    function closePaneDocument() {
      if (artifactKind !== "document" || !artifactDocumentPath) {
        return;
      }
      const target = {
        path: artifactDocumentPath,
        label: artifactDocumentTitle || artifactDocumentPath,
      };
      const targetIndex = openFileTargets.findIndex(
        (file) => file.path === artifactDocumentPath,
      );
      openFileTargets = openFileTargets.filter(
        (file) => file.path !== artifactDocumentPath,
      );
      const nextTarget = openFileTargets[
        Math.min(Math.max(targetIndex, 0), openFileTargets.length - 1)
      ];
      if (nextTarget) {
        selectFileTarget(nextTarget);
      } else {
        applyArtifactItem(null);
        notifyPaneArtifactChange(null);
        contentCatalogSync?.publish({ files: openFileTargets });
      }
      postDocumentFileAction("close", target);
    }

    function shellSessionLabel(session) {
      const status = session.status === "running" ? "running" : session.status || "done";
      const name = session.label || "Shell";
      return `${name} · ${status} · ${String(session.session_id || "").slice(0, 6)}`;
    }

    function renderShellSwitcher() {
      const visibleSessions = shellSessions.filter(
        (session) => session.status === "running" || session.session_id === selectedShellSessionId,
      );
      if (visibleSessions.length === 0) {
        updateSelectOptions(
          contentSwitcher,
          [{ value: "", label: "No active shells" }],
          "",
          true,
        );
        return;
      }
      if (!visibleSessions.some((session) => session.session_id === selectedShellSessionId)) {
        selectedShellSessionId = visibleSessions[0].session_id;
      }
      updateSelectOptions(
        contentSwitcher,
        visibleSessions.map((session) => ({
          value: session.session_id,
          label: shellSessionLabel(session),
        })),
        selectedShellSessionId,
        false,
      );
    }

    async function refreshShellSessions() {
      const response = await fetch(contextUrl("/api/shell/sessions"), {
        cache: "no-store",
      });
      const payload = await response.json().catch(() => ({ sessions: [] }));
      if (!response.ok) {
        return;
      }
      shellSessions = Array.isArray(payload.sessions) ? payload.sessions : [];
      const previousSessionId = selectedShellSessionId;
      renderShellSwitcher();
      if (selectedShellSessionId && selectedShellSessionId !== previousSessionId) {
        const nextSessionId = selectedShellSessionId;
        selectedShellSessionId = previousSessionId;
        selectShellSession(nextSessionId);
      }
    }

    function selectShellSession(sessionId) {
      if (!sessionId || sessionId === selectedShellSessionId) {
        return;
      }
      selectedShellSessionId = sessionId;
      contentSwitcher.value = selectedShellSessionId;
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("shell_session_id", selectedShellSessionId);
      window.history.replaceState(null, "", nextUrl);
      connectShellStream();
    }

    function initializeContentSwitcher() {
      if (PANE_KIND === "agent" || PANE_KIND === "input") {
        paneContentControl.hidden = false;
        paneContentLabel.textContent = "Agent";
        contentRefreshTimer = window.setInterval(
          () => refreshSessions().catch(() => {}),
          3000,
        );
        return;
      }
      if (PANE_KIND === "artifact") {
        paneContentControl.hidden = false;
        paneContentLabel.textContent = "File";
        if (artifactKind === "document" && artifactDocumentPath) {
          openFileTargets = [{
            path: artifactDocumentPath,
            label: artifactDocumentTitle || artifactDocumentPath,
          }];
        }
        renderFileSwitcher();
        contentCatalogSync = window.ElectroBoyPaneSync.connect({
          pane: "file-catalog",
          context: () => `${contextId}:${connectionId}`,
          priority: 10,
          snapshot: () => ({ files: openFileTargets }),
          receive: (state) => {
            if (!state || !Array.isArray(state.files)) {
              return;
            }
            openFileTargets = state.files
              .map((file) => ({
                path: String(file.path || ""),
                label: String(file.label || file.path || ""),
              }))
              .filter((file) => file.path);
            renderFileSwitcher();
          },
        });
        return;
      }
      if (PANE_KIND === "shell") {
        paneContentControl.hidden = false;
        paneContentLabel.textContent = "Shell";
        refreshShellSessions().catch(() => {});
        contentRefreshTimer = window.setInterval(
          () => refreshShellSessions().catch(() => {}),
          3000,
        );
      }
    }

    async function refreshSessions() {
      if (!contextId) {
        renderSessionSwitcher();
        return;
      }
      const response = await fetch(contextUrl("/api/project"), { cache: "no-store" });
      const payload = await response.json().catch(() => ({ error: "project load failed" }));
      if (!response.ok) {
        renderSessionSwitcher();
        return;
      }
      agentSessions = Array.isArray(payload.sessions) ? payload.sessions : [];
      activeProjectRoot = payload.active_project_root || payload.activation_root
        || payload.service_root || "";
      selectedSessionId = pinnedAgentSessionId ||
        payload.selected_session_id || selectedSessionId || "";
      if (!agentSessions.some((session) => session.session_id === selectedSessionId)) {
        const selected = agentSessions.find((session) => session.selected)
          || agentSessions.find((session) => session.status === "running")
          || agentSessions[0];
        selectedSessionId = selected ? selected.session_id : "";
        pinnedAgentSessionId = PANE_KIND === "agent" ? selectedSessionId : pinnedAgentSessionId;
        notifyPaneAgentSessionChange();
      }
      renderSessionSwitcher();
    }

    async function selectAgentSession(sessionId) {
      if (!sessionId || sessionId === selectedSessionId) {
        return;
      }
      if (PANE_KIND === "agent") {
        selectedSessionId = sessionId;
        pinnedAgentSessionId = sessionId;
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("session_id", pinnedAgentSessionId);
        window.history.replaceState(null, "", nextUrl);
        renderSessionSwitcher();
        connectAgentStream();
        notifyPaneAgentSessionChange();
        return;
      }
      const response = await fetch(contextUrl("/api/sessions/select"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId }),
      });
      const payload = await response.json().catch(() => ({ error: "session switch failed" }));
      if (!response.ok) {
        renderSessionSwitcher();
        return;
      }
      agentSessions = Array.isArray(payload.sessions) ? payload.sessions : agentSessions;
      selectedSessionId = payload.selected_session_id || sessionId;
      renderSessionSwitcher();
      if (PANE_KIND === "input") {
        agentInput.focus();
      }
      if (PANE_KIND === "agent") {
        connectAgentStream();
      }
    }

    function publishSharedPaneState(state) {
      if (sharedPaneSync && sharedPaneSync.available) {
        sharedPaneSync.publish(state);
      }
    }

    function agentInputState() {
      return {
        sessionId: selectedSessionId || "",
        value: agentInput.value,
      };
    }

    function publishAgentInputState() {
      publishSharedPaneState(agentInputState());
    }

    async function applySharedAgentInputState(state) {
      if (!state || typeof state.value !== "string") {
        return;
      }
      const sessionId = String(state.sessionId || "");
      const previousSessionId = selectedSessionId || "";
      if (previousSessionId) {
        agentInputDrafts.set(previousSessionId, agentInput.value);
      }
      if (sessionId && sessionId !== previousSessionId) {
        await selectAgentSession(sessionId);
      }
      if (sessionId) {
        agentInputDrafts.set(sessionId, state.value);
      }
      agentInput.value = state.value;
    }

    async function selectAgentInputSession(sessionId) {
      const previousSessionId = selectedSessionId || "";
      if (previousSessionId) {
        agentInputDrafts.set(previousSessionId, agentInput.value);
      }
      await selectAgentSession(sessionId);
      agentInput.value = agentInputDrafts.get(sessionId) || "";
      publishAgentInputState();
    }

    function renderSharedProgressState(state, publish = false) {
      if (!terminal || !state || !Array.isArray(state.entries)) {
        return;
      }
      latestProgressState = {
        entries: state.entries.map((entry) => ({
          text: String(entry.text || ""),
          className: entry.className || "",
        })),
      };
      resetTerminalOutput();
      latestProgressState.entries.forEach((entry) => {
        terminal.write(formatTerminalMessage(entry.text, entry.className));
      });
      if (publish) {
        publishSharedPaneState(latestProgressState);
      }
    }

    function setSharedStatusText(text, publish = false) {
      lastSharedStatusText = String(text || "");
      statusOutput.textContent = lastSharedStatusText;
      if (publish) {
        publishSharedPaneState({ text: lastSharedStatusText });
      }
    }

    function initializeSharedPaneSync() {
      if (!["scratch", "progress", "status", "input"].includes(PANE_KIND)) {
        return;
      }
      sharedPaneSync = window.ElectroBoyPaneSync.connect({
        pane: PANE_KIND,
        context: () => `${contextId}:${connectionId}`,
        priority: 10,
        snapshot: () => {
          if (PANE_KIND === "scratch") return { value: scratchPad.value };
          if (PANE_KIND === "progress") return latestProgressState;
          if (PANE_KIND === "status") return { text: statusOutput.textContent };
          return agentInputState();
        },
        receive: (state) => {
          if (PANE_KIND === "scratch" && state && typeof state.value === "string") {
            scratchPad.value = state.value;
            const storageKey = scratchPadStorageKey();
            if (storageKey) {
              try {
                window.localStorage.setItem(storageKey, state.value);
              } catch (error) {
                // The live view remains synchronized when storage is unavailable.
              }
            }
          } else if (PANE_KIND === "progress") {
            renderSharedProgressState(state);
          } else if (PANE_KIND === "status" && state && typeof state.text === "string") {
            setSharedStatusText(state.text);
          } else if (PANE_KIND === "input") {
            inputSyncQueue = inputSyncQueue
              .catch(() => {})
              .then(() => applySharedAgentInputState(state))
              .catch(() => {});
          }
        },
      });
    }

    function clampArtifactZoom(value) {
      if (!Number.isFinite(value)) {
        return 100;
      }
      const stepped = Math.round(value / ARTIFACT_ZOOM_STEP) * ARTIFACT_ZOOM_STEP;
      return Math.max(MIN_ARTIFACT_ZOOM, Math.min(MAX_ARTIFACT_ZOOM, stepped));
    }

    function applyArtifactZoom() {
      artifactZoomLevel.textContent = `${artifactZoom}%`;
      decreaseArtifactZoom.disabled = artifactZoom <= MIN_ARTIFACT_ZOOM;
      increaseArtifactZoom.disabled = artifactZoom >= MAX_ARTIFACT_ZOOM;
    }

    function changeArtifactZoom(delta) {
      artifactZoom = clampArtifactZoom(artifactZoom + delta);
      applyArtifactZoom();
      if (artifactEditing) {
        postArtifactEditorFontSize();
        return;
      }
      refreshArtifact();
    }

    function artifactEditorFontSize() {
      return Math.max(11, Math.min(28, Math.round(16 * (artifactZoom / 100))));
    }

    function postArtifactEditorFontSize() {
      if (!artifactEditing || !artifactFrame.contentWindow) {
        return;
      }
      artifactFrame.contentWindow.postMessage(
        {
          type: "electroboy-editor-font-size",
          font_size: artifactEditorFontSize(),
        },
        window.location.origin,
      );
    }

    function terminalOptions(disableStdin = true) {
      return {
        allowProposedApi: false,
        convertEol: true,
        cursorBlink: false,
        disableStdin,
        fontFamily: '"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace',
        fontSize,
        scrollback: 10000,
        termName: "xterm-256color",
        theme: {
          background: "#10141f",
          foreground: "#e7edf7",
          cursor: "#e7edf7",
          selectionBackground: "#2b6173",
          black: "#151923",
          red: "#ff6b6b",
          green: "#51cf66",
          yellow: "#ffd43b",
          blue: "#74c0fc",
          magenta: "#da77f2",
          cyan: "#66d9e8",
          white: "#f1f3f5",
          brightBlack: "#5c677d",
          brightRed: "#ff8787",
          brightGreen: "#69db7c",
          brightYellow: "#ffe066",
          brightBlue: "#91caff",
          brightMagenta: "#e599f7",
          brightCyan: "#99e9f2",
          brightWhite: "#ffffff",
        },
      };
    }

    function reportPaneError(message) {
      if (terminal) {
        terminal.write(formatTerminalMessage(`${message}\r\n`, "error"));
        return;
      }
      window.alert(message);
    }

    function timestampForDownload() {
      return new Date().toISOString().replace(/[:.]/g, "-");
    }

    function exportSafeName(value, fallback = "export") {
      return String(value || fallback)
        .replace(/[^A-Za-z0-9._-]+/g, "-")
        .replace(/^-+|-+$/g, "")
        || fallback;
    }

    function documentExportFormats() {
      return [
        {
          value: "markdown",
          label: "Markdown",
          extension: "md",
          description: "Markdown",
          accept: {
            "text/markdown": [".md"],
            "text/plain": [".txt"],
          },
        },
        {
          value: "docx",
          label: "DOCX",
          extension: "docx",
          description: "Word document",
          accept: {
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document": [
              ".docx",
            ],
          },
        },
        {
          value: "pdf",
          label: "PDF",
          extension: "pdf",
          description: "PDF",
          accept: {
            "application/pdf": [".pdf"],
          },
        },
      ];
    }

    function documentExportFormat(format) {
      return documentExportFormats().find((candidate) => candidate.value === format)
        || documentExportFormats()[0];
    }

    function documentExportPickerTypes(format = "markdown") {
      const selected = documentExportFormat(format);
      return [
        {
          description: selected.description,
          accept: selected.accept,
        },
      ];
    }

    function downloadBlob(fileName, blob) {
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.append(link);
      link.click();
      link.remove();
      window.setTimeout(() => window.URL.revokeObjectURL(url), 1000);
    }

    async function writeBlobWithPicker(
      blob,
      suggestedName,
      pickerTypes = documentExportPickerTypes("markdown"),
    ) {
      if (!window.showSaveFilePicker) {
        downloadBlob(suggestedName, blob);
        return;
      }
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: pickerTypes,
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
      } catch (error) {
        if (error && error.name === "AbortError") {
          return;
        }
        reportPaneError(`export picker failed: ${error}`);
        downloadBlob(suggestedName, blob);
      }
    }

    async function exportBlob(url, suggestedName, format = "markdown") {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        const message = await response.text();
        reportPaneError(message || "export failed");
        return;
      }
      const blob = await response.blob();
      await writeBlobWithPicker(
        blob,
        suggestedName,
        documentExportPickerTypes(format),
      );
    }

    async function exportMarkdown(url, suggestedName) {
      await exportBlob(url, suggestedName, "markdown");
    }

    function canExportPaneOutput() {
      return PANE_KIND === "agent"
        || PANE_KIND === "progress"
        || PANE_KIND === "artifact";
    }

    function artifactExportBaseName() {
      if (artifactKind === "document" && artifactDocumentPath) {
        return exportSafeName(artifactDocumentPath);
      }
      if (artifactKind === "route" && artifactRouteTitle) {
        return exportSafeName(artifactRouteTitle);
      }
      return exportSafeName(artifactKind || "document");
    }

    function paneExportFileName(format = "markdown") {
      if (PANE_KIND === "artifact") {
        const selected = documentExportFormat(format);
        return `${artifactExportBaseName()}.${selected.extension}`;
      }
      if (PANE_KIND === "progress") {
        return `progress-log-${timestampForDownload()}.md`;
      }
      return `agent-session-${timestampForDownload()}.md`;
    }

    function artifactDocumentExportUrl(format) {
      const parameters = new URLSearchParams();
      parameters.set("artifact", artifactKind);
      parameters.set("format", format);
      if (artifactKind === "document" && artifactDocumentPath) {
        parameters.set("path", artifactDocumentPath);
      }
      if (artifactKind === "route" && artifactRoutePath) {
        parameters.set("path", artifactRoutePath);
      }
      return contextUrl(`/api/documents/export?${parameters.toString()}`);
    }

    async function exportCurrentPaneOutput() {
      if (PANE_KIND === "artifact") {
        const format = exportPaneFormat.value || "markdown";
        await exportBlob(
          artifactDocumentExportUrl(format),
          paneExportFileName(format),
          format,
        );
        return;
      }
      if (PANE_KIND === "progress") {
        await exportMarkdown(
          contextUrl("/api/progress/export"),
          paneExportFileName(),
        );
        return;
      }
      await exportMarkdown(
        contextUrl(
          `/api/sessions/export?session_id=${encodeURIComponent(selectedSessionId)}`,
        ),
        paneExportFileName(),
      );
    }

    function normalizeAgentTerminalSessionId(sessionId = "") {
      return String(sessionId || selectedSessionId || "default");
    }

    function createAgentTerminalContext(sessionId = "") {
      const terminalSessionId = normalizeAgentTerminalSessionId(sessionId);
      const existing = agentTerminalContexts.get(terminalSessionId);
      if (existing) {
        return existing;
      }
      const host = document.createElement("div");
      host.className = "pane-agent-terminal-host";
      host.dataset.sessionId = terminalSessionId;
      host.hidden = true;
      terminalHost.append(host);
      const nextTerminal = new window.Terminal(terminalOptions(true));
      let nextFit = null;
      if (window.FitAddon && window.FitAddon.FitAddon) {
        nextFit = new window.FitAddon.FitAddon();
        nextTerminal.loadAddon(nextFit);
      }
      nextTerminal.open(host);
      window.ElectroBoyTerminalBehavior.install(nextTerminal);
      nextTerminal.onResize(({ cols, rows }) => {
        queueAgentResize(cols, rows, terminalSessionId);
      });
      const context = {
        sessionId: terminalSessionId,
        host,
        terminal: nextTerminal,
        fit: nextFit,
        outputQueue: [],
        flushTimer: null,
      };
      agentTerminalContexts.set(terminalSessionId, context);
      return context;
    }

    function selectAgentTerminal(sessionId = "") {
      terminalHost.hidden = false;
      const context = createAgentTerminalContext(sessionId);
      activeAgentTerminalSessionId = context.sessionId;
      for (const candidate of agentTerminalContexts.values()) {
        candidate.host.hidden = candidate.sessionId !== context.sessionId;
      }
      terminal = context.terminal;
      terminalFit = context.fit;
      terminal.options.fontSize = fontSize;
      ensureTerminalResizeTracking();
      window.requestAnimationFrame(fitTerminal);
      return context;
    }

    function activeAgentTerminalContext() {
      return agentTerminalContexts.get(activeAgentTerminalSessionId) || null;
    }

    function showTerminal(disableStdin = true, onData = null) {
      terminalHost.hidden = false;
      if (PANE_KIND === "agent") {
        selectAgentTerminal(selectedSessionId);
        return;
      }
      if (terminal) {
        terminal.options.disableStdin = disableStdin;
        window.requestAnimationFrame(fitTerminal);
        return;
      }
      terminal = new window.Terminal(terminalOptions(disableStdin));
      if (onData) {
        terminal.onData(onData);
      }
      if (window.FitAddon && window.FitAddon.FitAddon) {
        terminalFit = new window.FitAddon.FitAddon();
        terminal.loadAddon(terminalFit);
      }
      terminal.open(terminalHost);
      window.ElectroBoyTerminalBehavior.install(terminal);
      terminal.onResize(({ cols, rows }) => {
        if (PANE_KIND === "shell") {
          queueShellResize(cols, rows);
        } else if (PANE_KIND === "agent") {
          queueAgentResize(cols, rows);
        }
      });
      ensureTerminalResizeTracking();
      fitTerminal();
    }

    function fitTerminal() {
      if (!terminalFit) {
        return;
      }
      try {
        window.ElectroBoyTerminalBehavior.fit(terminal, terminalFit);
      } catch (error) {
        return;
      }
      if (PANE_KIND === "shell") {
        window.requestAnimationFrame(() => queueShellResize());
      } else if (PANE_KIND === "agent") {
        window.requestAnimationFrame(() => queueAgentResize());
      }
    }

    function observeTerminalPaneResize() {
      if (!window.ResizeObserver || terminalResizeObserver) {
        return;
      }
      terminalResizeObserver = new window.ResizeObserver(() => {
        window.requestAnimationFrame(fitTerminal);
      });
      terminalResizeObserver.observe(terminalHost);
    }

    function ensureTerminalResizeTracking() {
      observeTerminalPaneResize();
      if (terminalWindowResizeListenerInstalled) {
        return;
      }
      terminalWindowResizeListenerInstalled = true;
      window.addEventListener("resize", fitTerminal);
    }

    async function sendShellInput(data) {
      if (!contextId || !data) {
        return;
      }
      await fetch(shellContextUrl("/api/shell/input"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data }),
      }).catch(() => {});
    }

    async function sendShellResize(columns = null, rows = null) {
      if (!contextId || !terminal) {
        return;
      }
      await fetch(shellContextUrl("/api/shell/resize"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          columns: Number(columns || terminal.cols || 120),
          rows: Number(rows || terminal.rows || 32),
        }),
      }).catch(() => {});
    }

    function agentResizePayload(columns = null, rows = null, sessionId = "") {
      const resizeSessionId = normalizeAgentTerminalSessionId(sessionId);
      const context = agentTerminalContexts.get(resizeSessionId) ||
        activeAgentTerminalContext();
      if (!contextId || !context || !resizeSessionId || resizeSessionId === "default") {
        return null;
      }
      return {
        session_id: resizeSessionId,
        columns: Number(columns || context.terminal.cols || 120),
        rows: Number(rows || context.terminal.rows || 32),
      };
    }

    function queueAgentResize(columns = null, rows = null, sessionId = "") {
      const payload = agentResizePayload(columns, rows, sessionId);
      if (!payload) {
        return;
      }
      pendingTerminalResize = payload;
      window.clearTimeout(terminalResizeTimer);
      terminalResizeTimer = window.setTimeout(() => {
        const resize = pendingTerminalResize;
        pendingTerminalResize = null;
        sendAgentResize(resize);
      }, 120);
    }

    async function sendAgentResize(payload = null) {
      const resize = payload || agentResizePayload();
      if (!resize) {
        return;
      }
      await fetch(contextUrl("/api/sessions/resize"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(resize),
      }).catch(() => {});
    }

    function queueShellResize(columns = null, rows = null) {
      window.clearTimeout(terminalResizeTimer);
      terminalResizeTimer = window.setTimeout(
        () => sendShellResize(columns, rows),
        120,
      );
    }

    function formatTerminalMessage(text, type) {
      if (type === "error") return `\x1b[31m${text}\x1b[0m`;
      if (type === "system") return `\x1b[36m${text}\x1b[0m`;
      return text;
    }

    function terminalOutputTarget(sessionId = "") {
      if (PANE_KIND !== "agent") {
        return {
          terminal,
          outputQueue: terminalOutputQueue,
          flushTimer: terminalOutputFlushTimer,
          setOutputQueue: (value) => {
            terminalOutputQueue = value;
          },
          setFlushTimer: (value) => {
            terminalOutputFlushTimer = value;
          },
        };
      }
      return createAgentTerminalContext(sessionId || selectedSessionId);
    }

    function scheduleTerminalOutputFlush(target) {
      if (!target || target.flushTimer !== null) {
        return;
      }
      const timer = window.setTimeout(() => flushTerminalOutputQueue(target), 0);
      if (typeof target.setFlushTimer === "function") {
        target.setFlushTimer(timer);
      } else {
        target.flushTimer = timer;
      }
    }

    function flushTerminalOutputQueue(target = terminalOutputTarget()) {
      if (!target || !target.terminal) {
        return;
      }
      if (typeof target.setFlushTimer === "function") {
        target.setFlushTimer(null);
      } else {
        target.flushTimer = null;
      }
      if (target.outputQueue.length === 0) {
        return;
      }
      const start = window.performance ? window.performance.now() : Date.now();
      let chunk = "";
      while (target.outputQueue.length > 0) {
        const remainingCapacity = TERMINAL_OUTPUT_FLUSH_CHARS - chunk.length;
        if (remainingCapacity <= 0) {
          break;
        }
        const next = target.outputQueue[0] || "";
        if (!next) {
          target.outputQueue.shift();
          continue;
        }
        if (next.length <= remainingCapacity) {
          chunk += next;
          target.outputQueue.shift();
        } else {
          chunk += next.slice(0, remainingCapacity);
          target.outputQueue[0] = next.slice(remainingCapacity);
        }
        const elapsed = (window.performance ? window.performance.now() : Date.now()) -
          start;
        if (
          chunk.length >= TERMINAL_OUTPUT_FLUSH_CHARS ||
          elapsed >= TERMINAL_OUTPUT_FLUSH_BUDGET_MS
        ) {
          break;
        }
      }
      if (chunk) {
        target.terminal.write(chunk);
      }
      if (target.outputQueue.length > 0) {
        scheduleTerminalOutputFlush(target);
      }
    }

    function queueTerminalOutput(text, sessionId = "") {
      const output = String(text ?? "");
      const target = terminalOutputTarget(sessionId);
      if (!output || !target || !target.terminal) {
        return;
      }
      target.outputQueue.push(output);
      scheduleTerminalOutputFlush(target);
    }

    function clearTerminalOutputQueue(sessionId = "") {
      const target = terminalOutputTarget(sessionId);
      if (!target) {
        return;
      }
      if (typeof target.setOutputQueue === "function") {
        target.setOutputQueue([]);
      } else {
        target.outputQueue = [];
      }
      if (target.flushTimer !== null) {
        window.clearTimeout(target.flushTimer);
        if (typeof target.setFlushTimer === "function") {
          target.setFlushTimer(null);
        } else {
          target.flushTimer = null;
        }
      }
    }

    function resetTerminalOutput() {
      if (
        window.ElectroBoyTerminalBehavior &&
        typeof window.ElectroBoyTerminalBehavior.reset === "function"
      ) {
        return window.ElectroBoyTerminalBehavior.reset(terminal);
      }
      if (terminal && typeof terminal.clear === "function") {
        terminal.clear();
        return true;
      }
      return false;
    }

    function closeAgentPaneEventStream(sessionId) {
      const stream = agentEventStreams.get(sessionId);
      if (!stream) {
        return;
      }
      stream.source.close();
      agentEventStreams.delete(sessionId);
      if (eventSource === stream.source) {
        eventSource = null;
      }
    }

    function replacePaneEventSource(sessionId = "") {
      terminalStreamVersion += 1;
      if (PANE_KIND === "agent") {
        if (sessionId) {
          closeAgentPaneEventStream(sessionId);
          return terminalStreamVersion;
        }
        for (const streamSessionId of Array.from(agentEventStreams.keys())) {
          closeAgentPaneEventStream(streamSessionId);
        }
      }
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      return terminalStreamVersion;
    }

    function isCurrentPaneEventSource(source, version, sessionId = "") {
      if (PANE_KIND === "agent") {
        const stream = agentEventStreams.get(sessionId);
        return Boolean(stream && stream.source === source && stream.version === version);
      }
      return version === terminalStreamVersion && eventSource === source;
    }

    function connectAgentStream() {
      showTerminal();
      if (!contextId || !selectedSessionId || !selectedAgentSession()) {
        resetTerminalOutput();
        terminal.write("\x1b[31mno active agent stream\x1b[0m\r\n");
        return;
      }
      const streamSessionId = selectedSessionId;
      const existingStream = agentEventStreams.get(streamSessionId);
      if (existingStream) {
        eventSource = existingStream.source;
        window.requestAnimationFrame(() => queueAgentResize(null, null, streamSessionId));
        return;
      }
      terminalStreamVersion += 1;
      const streamVersion = terminalStreamVersion;
      const source = new EventSource(
        contextUrl(
          `/api/sessions/events?session_id=${encodeURIComponent(streamSessionId)}`,
        ),
      );
      eventSource = source;
      agentEventStreams.set(streamSessionId, { source, version: streamVersion });
      source.addEventListener("agent-event", (event) => {
        if (!isCurrentPaneEventSource(source, streamVersion, streamSessionId)) {
          return;
        }
        const payload = JSON.parse(event.data);
        if (payload.type === "output") {
          queueTerminalOutput(payload.terminal || payload.text || "", streamSessionId);
        } else if (payload.type === "system" || payload.type === "error") {
          queueTerminalOutput(
            formatTerminalMessage(`${payload.text}\r\n`, payload.type),
            streamSessionId,
          );
        } else if (payload.type === "completed") {
          queueTerminalOutput(
            formatTerminalMessage(
              `\r\nprocess exited with code ${payload.returncode}\r\n`,
              "system",
            ),
            streamSessionId,
          );
        }
      });
      source.onerror = () => {};
      window.requestAnimationFrame(() => queueAgentResize(null, null, streamSessionId));
    }

    function connectProgressStream() {
      showTerminal();
      if (!contextId) {
        replacePaneEventSource();
        terminal.write("\x1b[31mno active context\x1b[0m\r\n");
        return;
      }
      const streamVersion = replacePaneEventSource();
      const source = new EventSource(contextUrl("/api/progress/events"));
      eventSource = source;
      source.addEventListener("progress-event", (event) => {
        if (!isCurrentPaneEventSource(source, streamVersion)) {
          return;
        }
        const payload = JSON.parse(event.data);
        renderSharedProgressState({
          entries: [{
            text: payload.text || "",
            className: payload.type === "error" ? "error" : "",
          }],
        }, true);
        if (payload.running === false) {
          replacePaneEventSource();
        }
      });
      source.onerror = () => {};
    }

    function connectShellStream() {
      showTerminal(false, sendShellInput);
      const streamVersion = replacePaneEventSource();
      clearTerminalOutputQueue();
      resetTerminalOutput();
      if (!contextId) {
        terminal.write("\x1b[31mno active context\x1b[0m\r\n");
        return;
      }
      const source = new EventSource(shellContextUrl("/api/shell/events"));
      eventSource = source;
      source.addEventListener("agent-event", (event) => {
        if (!isCurrentPaneEventSource(source, streamVersion)) {
          return;
        }
        const payload = JSON.parse(event.data);
        if (payload.type === "output") {
          queueTerminalOutput(payload.terminal || payload.text || "");
        } else if (payload.type === "system" || payload.type === "error") {
          queueTerminalOutput(formatTerminalMessage(`${payload.text}\r\n`, payload.type));
        } else if (payload.type === "completed") {
          queueTerminalOutput(formatTerminalMessage(
            `\r\nproject shell exited with code ${payload.returncode}\r\n`,
            "system",
          ));
        }
      });
      source.onerror = () => {};
      window.requestAnimationFrame(sendShellResize);
    }

    function artifactTargetPath() {
      if (artifactKind === "document") {
        return artifactDocumentPath;
      }
      if (artifactKind === "route") {
        return artifactRoutePath;
      }
      if (artifactKind === "corkboard" || artifactKind === "creative-corkboard") {
        return artifactCorkboardId;
      }
      return "";
    }

    function artifactTargetTitle() {
      if (artifactKind === "document") {
        return artifactDocumentTitle || artifactDocumentPath;
      }
      if (artifactKind === "route") {
        return artifactRouteTitle || artifactRoutePath;
      }
      if (artifactKind === "corkboard" || artifactKind === "creative-corkboard") {
        return artifactCorkboardTitle || artifactFolderTitle || artifactCorkboardId;
      }
      if (artifactKind === "agenda") {
        return "Agenda";
      }
      if (artifactKind === "requirements") {
        return "Requirements";
      }
      return "";
    }

    function resetArtifactTargetState(kind = "empty") {
      artifactKind = kind || "empty";
      artifactDocumentPath = "";
      artifactDocumentTitle = "";
      artifactRoutePath = "";
      artifactRouteTitle = "";
      artifactFolderPath = "";
      artifactFolderTitle = "";
      artifactCorkboardPath = "";
      artifactCorkboardId = "";
      artifactCorkboardProvider = "";
      artifactCorkboardTitle = "";
      artifactAgendaProvider = "";
      artifactAgendaStyle = "";
      artifactEditing = false;
    }

    function applyArtifactItem(item) {
      const next = item && typeof item === "object" ? item : null;
      if (!next) {
        resetArtifactTargetState(PANE_KIND === "agenda" ? "agenda" : "empty");
        syncArtifactUrlState();
        renderFileSwitcher();
        reconnectArtifactStream();
        return;
      }
      resetArtifactTargetState(String(next.kind || "empty"));
      artifactEditing = Boolean(next.editing);
      if (artifactKind === "document" && next.target) {
        artifactDocumentPath = String(next.target.path || "");
        artifactDocumentTitle = String(
          next.target.label || next.title || artifactDocumentPath,
        );
      } else if (artifactKind === "route") {
        artifactRoutePath = String(next.path || "");
        artifactRouteTitle = String(next.title || artifactRoutePath);
      } else if (artifactKind === "corkboard" || artifactKind === "creative-corkboard") {
        const board = next.board || next.folder || next.corkboard || {};
        artifactCorkboardId = String(board.id || board.path || "");
        artifactCorkboardPath = artifactCorkboardId;
        artifactCorkboardProvider = String(board.provider || "");
        artifactCorkboardTitle = String(board.label || next.title || artifactCorkboardId);
      } else if (artifactKind === "agenda") {
        const agenda = next.agenda || {};
        artifactAgendaProvider = String(agenda.provider || "");
        artifactAgendaStyle = String(agenda.style || "");
      } else if (artifactKind === "calendar") {
        const calendar = next.calendar || {};
        artifactCalendarProvider = String(calendar.provider || "");
        artifactCalendarIds = Array.isArray(calendar.calendarIds)
          ? calendar.calendarIds.join(",")
          : String(calendar.calendarIds || "");
        artifactCalendarIdsExplicit = Boolean(calendar.calendarIdsExplicit);
        artifactCalendarMonth = String(calendar.month || "");
        artifactCalendarRangeStart = String(calendar.rangeStart || "");
        artifactCalendarRangeEnd = String(calendar.rangeEnd || "");
        artifactCalendarStyle = String(calendar.style || "");
      }
      syncArtifactUrlState();
      renderFileSwitcher();
      reconnectArtifactStream();
    }

    function currentArtifactItem() {
      if (artifactKind === "calendar") {
        return {
          id: `calendar-${artifactCalendarProvider || "active"}`,
          kind: "calendar",
          title: artifactTargetTitle(),
          editing: false,
          calendar: {
            provider: artifactCalendarProvider,
            label: artifactTargetTitle(),
            calendarIds: artifactCalendarIds
              ? artifactCalendarIds.split(",").map((item) => item.trim()).filter(Boolean)
              : [],
            calendarIdsExplicit: artifactCalendarIdsExplicit,
            month: artifactCalendarMonth,
            rangeStart: artifactCalendarRangeStart,
            rangeEnd: artifactCalendarRangeEnd,
            style: artifactCalendarStyle,
          },
        };
      }
      return null;
    }

    function publishArtifactItemChange() {
      if (window.parent === window || !paneInstanceId) {
        return;
      }
      const item = currentArtifactItem();
      if (!item) {
        return;
      }
      window.parent.postMessage(
        {
          type: "electroboy:pane-artifact-change",
          paneInstanceId,
          item,
        },
        window.location.origin,
      );
    }

    function applyCalendarMonthChange(data) {
      if (artifactKind !== "calendar") {
        return;
      }
      artifactCalendarMonth = String(data.month || "").trim();
      artifactCalendarRangeStart = String(data.rangeStart || data.range_start || "").trim();
      artifactCalendarRangeEnd = String(data.rangeEnd || data.range_end || "").trim();
      syncArtifactUrlState();
      publishArtifactItemChange();
      refreshArtifact();
    }

    function syncArtifactUrlState() {
      const nextUrl = new URL(window.location.href);
      for (const key of [
        "artifact",
        "document_path",
        "document_title",
        "artifact_path",
        "artifact_title",
        "folder_path",
        "folder_title",
        "corkboard_path",
        "corkboard_id",
        "corkboard_provider",
        "corkboard_title",
        "agenda_provider",
        "agenda_style",
        "calendar_provider",
        "calendar_ids",
        "calendar_ids_explicit",
        "calendar_month",
        "range_start",
        "range_end",
        "calendar_style",
      ]) {
        nextUrl.searchParams.delete(key);
      }
      nextUrl.searchParams.set("artifact", artifactKind || "empty");
      if (artifactKind === "document" && artifactDocumentPath) {
        nextUrl.searchParams.set("document_path", artifactDocumentPath);
        nextUrl.searchParams.set("document_title", artifactTargetTitle());
      } else if (artifactKind === "route" && artifactRoutePath) {
        nextUrl.searchParams.set("artifact_path", artifactRoutePath);
        nextUrl.searchParams.set("artifact_title", artifactTargetTitle());
      } else if (
        (artifactKind === "corkboard" || artifactKind === "creative-corkboard") &&
        artifactCorkboardId
      ) {
        nextUrl.searchParams.set("corkboard_id", artifactCorkboardId);
        nextUrl.searchParams.set("corkboard_title", artifactTargetTitle());
        if (artifactCorkboardProvider) {
          nextUrl.searchParams.set("corkboard_provider", artifactCorkboardProvider);
        }
      } else if (artifactKind === "agenda" && artifactAgendaProvider) {
        nextUrl.searchParams.set("agenda_provider", artifactAgendaProvider);
        if (artifactAgendaStyle) {
          nextUrl.searchParams.set("agenda_style", artifactAgendaStyle);
        }
      } else if (artifactKind === "calendar" && artifactCalendarProvider) {
        nextUrl.searchParams.set("calendar_provider", artifactCalendarProvider);
        if (artifactCalendarIdsExplicit) {
          nextUrl.searchParams.set("calendar_ids_explicit", "1");
        }
        if (artifactCalendarIds) {
          nextUrl.searchParams.set("calendar_ids", artifactCalendarIds);
        }
        if (artifactCalendarMonth) {
          nextUrl.searchParams.set("calendar_month", artifactCalendarMonth);
        }
        if (artifactCalendarRangeStart) {
          nextUrl.searchParams.set("range_start", artifactCalendarRangeStart);
        }
        if (artifactCalendarRangeEnd) {
          nextUrl.searchParams.set("range_end", artifactCalendarRangeEnd);
        }
        if (artifactCalendarStyle) {
          nextUrl.searchParams.set("calendar_style", artifactCalendarStyle);
        }
      }
      window.history.replaceState(null, "", nextUrl);
    }

    function reconnectArtifactStream() {
      if (artifactEventSource) {
        artifactEventSource.close();
        artifactEventSource = null;
      }
      connectArtifactStream();
      if (filePaneTools) filePaneTools.refresh();
    }

    function artifactUrl() {
      if (artifactKind === "requirements") {
        return `${contextUrl("/artifacts/requirements?embed=1")}&zoom=${artifactZoom}&version=${artifactVersion}`;
      }
      if (artifactKind === "document" && artifactDocumentPath) {
        const parameters = new URLSearchParams();
        parameters.set("path", artifactDocumentPath);
        parameters.set("title", artifactDocumentTitle || artifactDocumentPath);
        parameters.set("embed", "1");
        parameters.set("create", "1");
        parameters.set("zoom", String(artifactZoom));
        parameters.set("version", String(artifactVersion));
        return contextUrl(`/artifacts/document?${parameters.toString()}`);
      }
      if (artifactKind === "route" && artifactRoutePath) {
        const routeUrl = contextUrl(`${artifactRoutePath}?embed=1`);
        return `${routeUrl}&zoom=${artifactZoom}&version=${artifactVersion}`;
      }
      if (artifactKind === "corkboard" || artifactKind === "creative-corkboard") {
        if (!artifactCorkboardId) {
          return "";
        }
        const parameters = new URLSearchParams();
        parameters.set("board_id", artifactCorkboardId);
        if (artifactCorkboardProvider) {
          parameters.set("provider", artifactCorkboardProvider);
        }
        parameters.set(
          "title",
          artifactCorkboardTitle || artifactFolderTitle || artifactCorkboardId,
        );
        parameters.set("embed", "1");
        parameters.set("version", String(artifactVersion));
        return contextUrl(`/artifacts/corkboard?${parameters.toString()}`);
      }
      if (artifactKind === "agenda") {
        const parameters = new URLSearchParams();
        if (artifactAgendaProvider) {
          parameters.set("provider", artifactAgendaProvider);
        }
        if (artifactAgendaStyle) {
          parameters.set("style", artifactAgendaStyle);
        }
        parameters.set("embed", "1");
        parameters.set("version", String(artifactVersion));
        return contextUrl(`/artifacts/agenda?${parameters.toString()}`);
      }
      if (artifactKind === "calendar") {
        const parameters = new URLSearchParams();
        if (artifactCalendarProvider) {
          parameters.set("provider", artifactCalendarProvider);
        }
        if (artifactCalendarIdsExplicit) {
          parameters.set("calendar_ids_explicit", "1");
        }
        if (artifactCalendarIds) {
          parameters.set("calendar_ids", artifactCalendarIds);
        }
        if (artifactCalendarMonth) {
          parameters.set("month", artifactCalendarMonth);
        }
        if (artifactCalendarRangeStart) {
          parameters.set("range_start", artifactCalendarRangeStart);
        }
        if (artifactCalendarRangeEnd) {
          parameters.set("range_end", artifactCalendarRangeEnd);
        }
        if (artifactCalendarStyle) {
          parameters.set("style", artifactCalendarStyle);
        }
        parameters.set("embed", "1");
        parameters.set("version", String(artifactVersion));
        return contextUrl(`/artifacts/calendar?${parameters.toString()}`);
      }
      return "";
    }

    function artifactEditUrl() {
      if (
        artifactKind === "corkboard" ||
        artifactKind === "creative-corkboard" ||
        artifactKind === "agenda" ||
        artifactKind === "calendar"
      ) {
        return artifactUrl();
      }
      const parameters = new URLSearchParams();
      parameters.set("artifact", artifactKind);
      parameters.set("document_zoom", String(artifactZoom));
      parameters.set("font_size", String(artifactEditorFontSize()));
      if (artifactKind === "document" && artifactDocumentPath) {
        parameters.set("path", artifactDocumentPath);
        parameters.set("title", artifactDocumentTitle || artifactDocumentPath);
        parameters.set("create", "1");
      }
      if (artifactKind === "route" && artifactRoutePath) {
        parameters.set("path", artifactRoutePath);
        parameters.set("title", artifactRouteTitle || artifactRoutePath);
      }
      return contextUrl(`/artifacts/edit?${parameters.toString()}`);
    }

    function refreshArtifact() {
      artifactVersion += 1;
      artifactFrame.classList.add("loading");
      if (artifactKind === "empty") {
        artifactFrame.removeAttribute("src");
        artifactFrame.srcdoc = `<!doctype html><html><body style="margin:0;display:grid;place-items:center;height:100vh;background:#10141f;color:#77849a;font:14px system-ui,sans-serif">No file open</body></html>`;
        return;
      }
      artifactFrame.removeAttribute("srcdoc");
      artifactFrame.src = artifactEditing ? artifactEditUrl() : artifactUrl();
    }

    function setArtifactEditMode(editing) {
      artifactEditing = Boolean(editing);
      previewArtifactButton.classList.toggle("active", !artifactEditing);
      editArtifactButton.classList.toggle("active", artifactEditing);
      refreshArtifact();
    }

    function artifactEventUrl() {
      if (artifactKind === "requirements") {
        return contextUrl("/api/artifacts/events?artifact=requirements");
      }
      const parameters = new URLSearchParams();
      if (artifactKind === "document" && artifactDocumentPath) {
        parameters.set("artifact", "document");
        parameters.set("path", artifactDocumentPath);
        return contextUrl(`/api/artifacts/events?${parameters.toString()}`);
      }
      if (artifactKind === "route" && artifactRoutePath) {
        parameters.set("artifact", "route");
        parameters.set("path", artifactRoutePath);
        return contextUrl(`/api/artifacts/events?${parameters.toString()}`);
      }
      return "";
    }

    function connectArtifactStream() {
      const isProviderView = artifactKind === "corkboard" ||
        artifactKind === "creative-corkboard" ||
        artifactKind === "agenda" ||
        artifactKind === "calendar";
      const isEmpty = artifactKind === "empty";
      artifactFrame.hidden = false;
      artifactZoomControls.hidden = isProviderView;
      refreshArtifactButton.hidden = false;
      previewArtifactButton.hidden = isProviderView;
      editArtifactButton.hidden = isProviderView;
      exportPaneFormat.hidden = isProviderView;
      exportPaneOutput.hidden = isProviderView;
      if (isEmpty) {
        artifactZoomControls.hidden = true;
        refreshArtifactButton.hidden = true;
        previewArtifactButton.hidden = true;
        editArtifactButton.hidden = true;
        exportPaneFormat.hidden = true;
        exportPaneOutput.hidden = true;
      }
      previewArtifactButton.classList.toggle("active", !artifactEditing);
      editArtifactButton.classList.toggle("active", artifactEditing);
      applyArtifactZoom();
      refreshArtifact();
      if (!contextId) {
        return;
      }
      const eventUrl = artifactEventUrl();
      if (!eventUrl) {
        return;
      }
      artifactEventSource = new EventSource(eventUrl);
      artifactEventSource.addEventListener("artifact-event", refreshArtifact);
      artifactEventSource.onerror = () => {};
      if (filePaneTools) filePaneTools.refresh();
    }

    function showScratchPad() {
      scratchPad.hidden = false;
      const storageKey = scratchPadStorageKey();
      try {
        scratchPad.value = storageKey
          ? window.localStorage.getItem(storageKey) || ""
          : "";
      } catch (error) {
        scratchPad.value = "";
      }
      scratchPad.addEventListener("input", () => {
        const activeStorageKey = scratchPadStorageKey();
        if (!activeStorageKey) {
          return;
        }
        try {
          window.localStorage.setItem(activeStorageKey, scratchPad.value);
          publishSharedPaneState({ value: scratchPad.value });
        } catch (error) {
          return;
        }
      });
      scratchPad.focus();
    }

    function scratchPadStorageKey() {
      if (!contextId) {
        return "";
      }
      return `${SCRATCH_PAD_STORAGE_KEY}.${contextId}`;
    }

    async function refreshStatus() {
      if (!contextId) {
        setSharedStatusText("no active project\n", true);
        return;
      }
      setSharedStatusText("refreshing status...\n", true);
      const response = await fetch(contextUrl("/api/project/status"), {
        cache: "no-store",
      });
      const payload = await response.json().catch(() => ({ error: "status failed" }));
      setSharedStatusText(response.ok
        ? payload.output || "status: none\n"
        : `${payload.error || "status failed"}\n`, true);
    }

    function showStatus() {
      statusOutput.hidden = false;
      if (sharedPaneSync && sharedPaneSync.available) {
        sharedPaneSync.request();
        return;
      }
      refreshStatus();
      statusTimer = window.setInterval(refreshStatus, 2500);
    }

    async function sendMessage() {
      if (slashCommandMode) {
        sendTerminalKey("enter");
        finishSlashCommandMode();
        return;
      }
      const message = agentInput.value;
      if (!message.trim()) {
        return;
      }
      agentInput.value = "";
      publishAgentInputState();
      await fetch(contextUrl("/api/sessions/message"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
    }

    function queueTerminalInput(task) {
      const next = terminalInputQueue.catch(() => {}).then(task);
      terminalInputQueue = next.catch(() => {});
      return next;
    }

    function sendTerminalKey(key) {
      return queueTerminalInput(async () => {
        await fetch(contextUrl("/api/sessions/key"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key }),
        });
      });
    }

    function sendTerminalRaw(data) {
      if (!data) {
        return Promise.resolve();
      }
      return queueTerminalInput(async () => {
        await fetch(contextUrl("/api/sessions/raw"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data }),
        });
      });
    }

    function printableInputEvent(event) {
      return (
        !event.altKey &&
        !event.ctrlKey &&
        !event.metaKey &&
        event.key &&
        event.key.length === 1
      );
    }

    function slashCommandTerminalKeyForInputEvent(event) {
      if (event.altKey || event.ctrlKey || event.metaKey) {
        return "";
      }
      if (
        event.key === "Enter" ||
        event.code === "Enter" ||
        event.code === "NumpadEnter"
      ) {
        return "enter";
      }
      if (event.key === "Escape") return "escape";
      if (event.key === "ArrowUp") return "up";
      if (event.key === "ArrowDown") return "down";
      if (event.key === "ArrowLeft") return "left";
      if (event.key === "ArrowRight") return "right";
      if (event.key === "Backspace") return "backspace";
      if (event.key === "Delete") return "delete";
      if (event.key === "Tab") return "tab";
      return "";
    }

    function refreshSlashCommandModeAfterEdit() {
      window.setTimeout(() => {
        if (!agentInput.value.trimStart().startsWith("/")) {
          slashCommandMode = false;
        }
      }, 0);
    }

    function finishSlashCommandMode() {
      slashCommandMode = false;
      agentInput.value = "";
      publishAgentInputState();
    }

    function handleSlashCommandInput(event) {
      if (
        !slashCommandMode &&
        printableInputEvent(event) &&
        event.key === "/" &&
        agentInput.value.trim().length === 0
      ) {
        slashCommandMode = true;
        sendTerminalRaw(event.key);
        return true;
      }
      if (!slashCommandMode) {
        return false;
      }
      const slashKey = slashCommandTerminalKeyForInputEvent(event);
      if (slashKey) {
        sendTerminalKey(slashKey);
        if (slashKey === "enter" || slashKey === "escape") {
          event.preventDefault();
          finishSlashCommandMode();
        } else if (slashKey === "backspace" || slashKey === "delete") {
          refreshSlashCommandModeAfterEdit();
        } else {
          event.preventDefault();
        }
        return true;
      }
      if (printableInputEvent(event)) {
        sendTerminalRaw(event.key);
        return true;
      }
      return false;
    }

    function terminalKeyForInputEvent(event) {
      if (
        !event.altKey &&
        !event.ctrlKey &&
        !event.metaKey &&
        !event.shiftKey &&
        event.key === "Escape"
      ) {
        return "escape";
      }
      if (agentInput.value.length > 0) {
        return "";
      }
      if (
        event.ctrlKey &&
        !event.altKey &&
        !event.metaKey &&
        !event.shiftKey &&
        /^[0-9]$/.test(event.key)
      ) {
        return event.key;
      }
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) {
        return "";
      }
      if (
        event.key === "Enter" ||
        event.code === "Enter" ||
        event.code === "NumpadEnter"
      ) {
        return "enter";
      }
      if (event.key === "ArrowUp") return "up";
      if (event.key === "ArrowDown") return "down";
      if (event.key === "ArrowLeft") return "left";
      if (event.key === "ArrowRight") return "right";
      if (event.key === "Tab") return "tab";
      return "";
    }

    async function interruptAgentSession() {
      await fetch(contextUrl("/api/sessions/interrupt"), { method: "POST" });
    }

    function insertTextAtCursor(text) {
      const start = agentInput.selectionStart ?? agentInput.value.length;
      const end = agentInput.selectionEnd ?? start;
      const prefix = start > 0 && !/\s$/.test(agentInput.value.slice(0, start)) ? " " : "";
      const suffix = end < agentInput.value.length && !/^\s/.test(agentInput.value.slice(end))
        ? " "
        : "";
      agentInput.setRangeText(`${prefix}${text}${suffix}`, start, end, "end");
      publishAgentInputState();
      agentInput.focus();
    }

    function openLinkFileBrowser() {
      const parameters = new URLSearchParams();
      parameters.set("path", activeProjectRoot || ".");
      parameters.set("mode", "link");
      window.open(
        `/file-browser?${parameters.toString()}`,
        "electroboy-pane-file-link-browser",
        "popup=yes,width=980,height=720,scrollbars=yes,resizable=yes",
      );
    }

    function showInput() {
      inputLayout.hidden = false;
      refreshSessions();
      applyFontSize();
      agentInput.focus();
    }

    function restorePoppedPane() {
      if (EMBEDDED_PANE) {
        return;
      }
      if (PANE_KIND === "shell" && disposableShell) {
        window.close();
        return;
      }
      if (window.opener) {
        window.opener.postMessage(
          { type: "electroboy-pane-restore", pane: PANE_KIND },
          window.location.origin,
        );
      }
      window.close();
    }

    function stopDisposableShell() {
      if (
        PANE_KIND !== "shell"
        || !disposableShell
        || !contextId
        || !ownedShellSessionId
        || disposableShellStopped
      ) {
        return;
      }
      disposableShellStopped = true;
      const stopUrl = new URL(contextUrl("/api/shell/stop"), window.location.origin);
      stopUrl.searchParams.set("session_id", ownedShellSessionId);
      const url = `${stopUrl.pathname}${stopUrl.search}`;
      if (!navigator.sendBeacon(url)) {
        fetch(url, { method: "POST", keepalive: true }).catch(() => {});
      }
    }

    function workspacePaneUrl(kind) {
      const paneParameters = new URLSearchParams(params);
      paneParameters.set("embedded", "1");
      return `/pane/${encodeURIComponent(kind)}?${paneParameters.toString()}`;
    }

    function initialPaneWorkspaceLayout() {
      if (PANE_KIND !== "agent") {
        return null;
      }
      return {
        type: "split",
        direction: "column",
        ratio: 0.72,
        first: { type: "leaf", kind: "agent" },
        second: { type: "leaf", kind: "input" },
      };
    }

    function initializePaneWorkspace() {
      directPaneWindow.hidden = true;
      workspaceWindow.hidden = false;
      document.title = `ElectroBoy ${titleForPane(PANE_KIND)} workspace`;
      if (PANE_KIND === "shell" && disposableShell) {
        dockWorkspace.hidden = true;
      } else {
        dockWorkspace.addEventListener("click", restorePoppedPane);
      }
      window.ElectroBoyPaneWorkspace.create({
        root: workspaceLayout,
        resetButton: resetWorkspace,
        initialKind: PANE_KIND,
        initialLayout: initialPaneWorkspaceLayout(),
        storageKey: `electroboy.paneWorkspaceLayout.v2.${PANE_KIND}`,
        kinds: [
          { id: "agent", label: "Agent" },
          { id: "progress", label: "Progress" },
          { id: "artifact", label: "File" },
          { id: "agenda", label: "Agenda" },
          { id: "calendar", label: "Calendar" },
          { id: "shell", label: "Shell" },
          { id: "scratch", label: "Scratch" },
          { id: "status", label: "Status" },
          { id: "input", label: "Agent input" },
        ],
        paneUrl: workspacePaneUrl,
        onChange(layout, paneLeaves) {
          const count = paneLeaves.length;
          workspaceTitle.textContent = count === 1
            ? `${titleForPane(PANE_KIND)} workspace`
            : `${titleForPane(PANE_KIND)} workspace · ${count} panes`;
        },
      });
    }

    function bindArtifactFrameActivation() {
      const notifyPaneActivated = directPaneActivationNotifier;
      if (!notifyPaneActivated) {
        return;
      }
      try {
        const frameWindow = artifactFrame.contentWindow;
        if (frameWindow && !frameWindow.__electroBoyPaneActivationBound) {
          frameWindow.__electroBoyPaneActivationBound = true;
          frameWindow.addEventListener("focus", notifyPaneActivated);
          frameWindow.addEventListener("blur", notifyPaneActivated);
        }
        const frameDocument = artifactFrame.contentDocument;
        if (frameDocument && !frameDocument.__electroBoyPaneActivationBound) {
          frameDocument.__electroBoyPaneActivationBound = true;
          frameDocument.addEventListener("pointerdown", notifyPaneActivated, true);
          frameDocument.addEventListener("mousedown", notifyPaneActivated, true);
          frameDocument.addEventListener("touchstart", notifyPaneActivated, true);
          frameDocument.addEventListener("focusin", notifyPaneActivated, true);
        }
      } catch (error) {
        // Artifact panes are expected to be same-origin. Keep activation
        // best-effort if an artifact renderer changes that assumption.
      }
    }

    function initializeDirectPane() {
      dockPane.hidden = true;
      initializeSharedPaneSync();
      const notifyPaneActivated = () => {
        if (!paneInstanceId || window.parent === window) {
          return;
        }
        window.parent.postMessage(
          {
            type: "electroboy:pane-activate",
            paneInstanceId,
          },
          window.location.origin,
        );
      };
      directPaneActivationNotifier = notifyPaneActivated;
      document.addEventListener("pointerdown", notifyPaneActivated, true);
      document.addEventListener("mousedown", notifyPaneActivated, true);
      window.addEventListener("focus", notifyPaneActivated);
      window.addEventListener("blur", notifyPaneActivated);
      artifactFrame.addEventListener("focus", notifyPaneActivated);
      bindArtifactFrameActivation();
    decreaseArtifactZoom.addEventListener(
      "click",
      () => changeArtifactZoom(-ARTIFACT_ZOOM_STEP),
    );
    increaseArtifactZoom.addEventListener(
      "click",
      () => changeArtifactZoom(ARTIFACT_ZOOM_STEP),
    );
    refreshArtifactButton.addEventListener("click", refreshArtifact);
    artifactFrame.addEventListener("load", () => {
      artifactFrame.classList.remove("loading");
      bindArtifactFrameActivation();
      postArtifactEditorFontSize();
    });
    previewArtifactButton.addEventListener("click", () => setArtifactEditMode(false));
    editArtifactButton.addEventListener("click", () => setArtifactEditMode(true));
    exportPaneOutput.addEventListener("click", () => {
      exportCurrentPaneOutput().catch((error) => {
        if (terminal) {
          terminal.write(formatTerminalMessage(`export failed: ${error}\r\n`, "error"));
        }
      });
    });
    decreasePaneFont.addEventListener("click", () => changeFontSize(-1));
    resetPaneFont.addEventListener("click", resetFontSize);
    increasePaneFont.addEventListener("click", () => changeFontSize(1));
    window.addEventListener("storage", (event) => {
      if (PANE_KIND === "scratch" && event.key === scratchPadStorageKey()) {
        const selectionStart = scratchPad.selectionStart;
        const selectionEnd = scratchPad.selectionEnd;
        scratchPad.value = event.newValue || "";
        if (document.activeElement === scratchPad) {
          const length = scratchPad.value.length;
          scratchPad.setSelectionRange(
            Math.min(selectionStart, length),
            Math.min(selectionEnd, length),
          );
        }
        return;
      }
      if (event.key === TERMINAL_FONT_STORAGE_KEY) {
        const nextBase = Number(event.newValue || "");
        if (Number.isFinite(nextBase) && nextBase > 0) {
          baseFontSize = clampFontSize(nextBase);
          applyFontSize();
        }
        return;
      }
      if (event.key !== PANE_FONT_OFFSET_STORAGE_PREFIX + fontPane) {
        return;
      }
      fontOffset = localStoredFontOffset();
      applyFontSize();
    });
    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) {
        return;
      }
      const data = event.data || {};
      if (
        data.type === "electroboy-file-browser-select" &&
        data.mode === "link" &&
        data.path
      ) {
        insertTextAtCursor(String(data.path));
        return;
      }
      if (
        data.type === "electroboy-file-browser-select"
        && (data.mode === "document" || data.mode === "document-new")
        && data.path
      ) {
        try {
          const target = paneDocumentTargetFromSelectedPath(data.path);
          if (target) {
            selectFileTarget(target);
            postDocumentFileAction("open", target);
          }
        } catch (error) {
          window.alert(error.message || String(error));
        }
        return;
      }
      if (data.type === "electroboy-artifact-saved") {
        artifactVersion += 1;
        if (!artifactEditing) {
          refreshArtifact();
        }
        return;
      }
      if (data.type === "electroboy-calendar-month-change") {
        applyCalendarMonthChange(data);
        return;
      }
      if (
        data.type === "electroboy:pane-set-agent-session" &&
        PANE_KIND === "agent" &&
        (!data.paneInstanceId || data.paneInstanceId === paneInstanceId)
      ) {
        selectAgentSession(String(data.sessionId || ""));
        return;
      }
      if (
        (data.type === "electroboy:pane-set-artifact" ||
          data.type === "electroboy:pane-set-content") &&
        (PANE_KIND === "artifact" ||
          PANE_KIND === "agenda" ||
          PANE_KIND === "calendar") &&
        (!data.paneInstanceId || data.paneInstanceId === paneInstanceId)
      ) {
        applyArtifactItem(data.item || null);
      }
    });
    contentSwitcher.addEventListener("change", () => {
      if (PANE_KIND === "input") {
        selectAgentInputSession(contentSwitcher.value).catch(() => {});
      } else if (PANE_KIND === "agent") {
        selectAgentSession(contentSwitcher.value);
      } else if (PANE_KIND === "artifact") {
        if (!contentSwitcher.value) {
          return;
        }
        selectFileTarget(
          openFileTargets.find((file) => file.path === contentSwitcher.value),
        );
      } else if (PANE_KIND === "shell") {
        selectShellSession(contentSwitcher.value);
      }
    });
    interruptAgent.addEventListener("click", interruptAgentSession);
    linkAgentFile.addEventListener("click", openLinkFileBrowser);
    agentInput.addEventListener("keydown", (event) => {
      if (handleSlashCommandInput(event)) {
        return;
      }
      if (shortcutController.matches(event)) {
        event.preventDefault();
        if (agentInput.value.trim()) {
          sendMessage();
        } else {
          sendTerminalKey("enter");
        }
        return;
      }
      const terminalKey = terminalKeyForInputEvent(event);
      if (terminalKey) {
        event.preventDefault();
        sendTerminalKey(terminalKey);
        return;
      }
    });
    agentInput.addEventListener("input", () => {
      if (PANE_KIND !== "input") {
        return;
      }
      if (selectedSessionId) {
        agentInputDrafts.set(selectedSessionId, agentInput.value);
      }
      publishAgentInputState();
    });

    paneToolsController = window.ElectroBoyPaneTools.create({
      host: paneBody,
      shelf: paneToolsShelf,
      content: paneToolsContent,
      toggleButton: paneToolsToggle,
      closeButton: closePaneTools,
      resizeHandle: paneToolsResizeHandle,
      storageKey: `electroboy.paneTools.${contextId}.${PANE_KIND}`,
      defaultOpen: PANE_KIND === "agenda",
      side: PANE_KIND === "agenda" ? "left" : "right",
      onResize: fitTerminal,
    });
    if (PANE_KIND === "artifact" && window.ElectroBoyFilePaneTools) {
      filePaneTools = window.ElectroBoyFilePaneTools.mount({
        controller: paneToolsController,
        frame: artifactFrame,
        contextUrl,
        getTarget: () => ({
          kind: artifactKind,
          path: artifactTargetPath(),
          title: artifactTargetTitle(),
          editing: artifactEditing,
          canClose: artifactKind === "document" && Boolean(artifactDocumentPath),
          canPop: params.get("popped") !== "1" && artifactKind !== "empty",
        }),
        actions: {
          startAgent: startPaneDocumentAgent,
          open: () => openPaneDocumentFileBrowser("document"),
          new: () => openPaneDocumentFileBrowser("document-new"),
          close: closePaneDocument,
          pop: popOutCurrentArtifact,
        },
        controls: {
          zoom: artifactZoomControls,
          preview: previewArtifactButton,
          edit: editArtifactButton,
          refresh: refreshArtifactButton,
          exportFormat: exportPaneFormat,
          exportButton: exportPaneOutput,
        },
      });
    }
    if (PANE_KIND === "agenda" && window.ElectroBoyAgendaPaneTools) {
      paneBody.classList.add("agenda-pane");
      paneToolsTitle.textContent = "Agenda filters";
      window.ElectroBoyAgendaPaneTools.mount({
        controller: paneToolsController,
        frame: artifactFrame,
      });
    }

    paneTitle.textContent = titleForPane(PANE_KIND);
    if (PANE_KIND === "agenda") {
      refreshArtifactButton.title = "Refresh agenda";
      refreshArtifactButton.setAttribute("aria-label", "Refresh agenda");
    }
    if (PANE_KIND === "calendar") {
      refreshArtifactButton.title = "Refresh calendar";
      refreshArtifactButton.setAttribute("aria-label", "Refresh calendar");
    }
    initializeContentSwitcher();
    exportPaneFormat.hidden = PANE_KIND !== "artifact";
    exportPaneOutput.hidden = !canExportPaneOutput();
    if (PANE_KIND === "agent") {
      refreshSessions()
        .catch(() => {})
        .then(() => {
          if (selectedAgentSession()) {
            connectAgentStream();
          }
        });
    }
    else if (PANE_KIND === "progress") connectProgressStream();
    else if (
      PANE_KIND === "artifact" ||
      PANE_KIND === "agenda" ||
      PANE_KIND === "calendar"
    ) {
      connectArtifactStream();
    }
    else if (PANE_KIND === "scratch") showScratchPad();
    else if (PANE_KIND === "status") showStatus();
    else if (PANE_KIND === "input") showInput();
    else if (PANE_KIND === "shell") connectShellStream();

    window.addEventListener("beforeunload", () => {
      stopDisposableShell();
      if (sharedPaneSync) sharedPaneSync.close();
      if (contentCatalogSync) contentCatalogSync.close();
      replacePaneEventSource();
      if (artifactEventSource) artifactEventSource.close();
      clearTerminalOutputQueue();
      if (statusTimer) window.clearInterval(statusTimer);
      if (contentRefreshTimer) window.clearInterval(contentRefreshTimer);
    });
    }

    if (EMBEDDED_PANE) {
      initializeDirectPane();
    } else {
      initializePaneWorkspace();
    }
  </script>
</body>
</html>
