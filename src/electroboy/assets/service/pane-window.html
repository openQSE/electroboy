<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroBoy Pane</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
  >
  <link rel="stylesheet" href="/assets/service/css/pane-tools.css">
  <link rel="stylesheet" href="/assets/service/css/agenda-pane-tools.css">
  <style>
    :root {
      --terminal: #10141f;
      --terminal-text: #e7edf7;
      --border: #2a3142;
      --font-size: 15px;
      --ui-small-font-size: calc(var(--font-size) - 2px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--terminal);
      color: var(--terminal-text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-size: var(--font-size);
      overflow: hidden;
    }

    .pane-session-dialog {
      width: min(680px, calc(100vw - 40px));
      max-height: min(720px, calc(100vh - 40px));
      padding: 0;
      overflow: hidden;
      border: 1px solid #364156;
      border-radius: 8px;
      background: #151b29;
      color: var(--terminal-text);
      box-shadow: 0 24px 64px rgb(0 0 0 / 42%);
    }

    .pane-session-dialog::backdrop {
      background: rgb(0 0 0 / 56%);
      backdrop-filter: blur(2px);
    }

    .pane-session-form {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      max-height: min(720px, calc(100vh - 40px));
    }

    .pane-session-header,
    .pane-session-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      background: #1b2434;
    }

    .pane-session-header {
      border-bottom: 1px solid #364156;
    }

    .pane-session-header h2,
    .pane-session-header p {
      margin: 0;
    }

    .pane-session-header h2 {
      font-size: 16px;
      font-weight: 650;
    }

    .pane-session-header p,
    .pane-session-details,
    .pane-session-error {
      color: #aab8cf;
      font-size: calc(var(--font-size) - 2px);
    }

    .pane-session-close,
    .pane-session-cancel,
    .pane-session-submit {
      min-height: 32px;
      border: 1px solid #364156;
      border-radius: 6px;
      background: #1d2638;
      color: var(--terminal-text);
      cursor: pointer;
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
    }

    .pane-session-submit {
      background: #1f6f8b;
      border-color: #66d9e8;
      color: #ffffff;
    }

    .pane-session-options {
      display: grid;
      gap: 8px;
      min-width: 0;
      margin: 0;
      overflow: auto;
      border: 0;
      padding: 16px 18px;
    }

    .pane-session-options legend {
      color: #aab8cf;
      font-size: calc(var(--font-size) - 3px);
      font-weight: 750;
      text-transform: uppercase;
    }

    .pane-session-list {
      display: grid;
      gap: 8px;
    }

    .pane-session-option {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      border: 1px solid #364156;
      border-radius: 8px;
      background: #101827;
      padding: 10px 12px;
    }

    .pane-session-option input[type="radio"] {
      margin-top: 3px;
    }

    .pane-session-option-copy {
      display: grid;
      min-width: 0;
      gap: 4px;
    }

    .pane-session-option-copy strong,
    .pane-session-details {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pane-session-id {
      width: 100%;
      min-height: 32px;
      border: 1px solid #364156;
      border-radius: 6px;
      background: #0d1422;
      color: var(--terminal-text);
      font: inherit;
      padding: 0 8px;
    }

    .pane-session-error {
      margin: 0;
      border-top: 1px solid #364156;
      padding: 8px 18px 0;
      color: #ff9b9b;
    }

    .pane-window {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    .pane-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
      border-bottom: 1px solid var(--border);
      background: #151b29;
      padding: 0 10px 0 12px;
      font-weight: 400;
      text-transform: uppercase;
    }

    .pane-toolbar button,
    .pane-toolbar select,
    .input-actions button,
    .input-actions select {
      min-height: 30px;
      border: 1px solid #364156;
      border-radius: 6px;
      background: #1d2638;
      color: var(--terminal-text);
      cursor: pointer;
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 750;
    }

    .pane-toolbar select {
      min-width: 100px;
      cursor: pointer;
    }

    .pane-toolbar button.active {
      border-color: #66d9e8;
      background: #1f6f8b;
      color: #ffffff;
    }

    .input-actions select {
      min-width: 150px;
      cursor: pointer;
    }

    .pane-actions,
    .artifact-zoom-controls,
    .pane-font-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .artifact-zoom-controls[hidden] {
      display: none;
    }

    .artifact-zoom-level {
      min-width: 44px;
      text-align: center;
      color: #aab8cf;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 750;
    }

    .pane-font-level {
      min-width: 44px;
      text-align: center;
      color: #aab8cf;
      font-size: calc(var(--font-size) - 2px);
      font-weight: 750;
    }

    .pane-body {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      min-height: 0;
      overflow: hidden;
    }

    .pane-content-surface {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .terminal-host,
    .artifact-frame,
    .scratch-pad,
    .status-output,
    .input-text {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: var(--terminal);
      color: var(--terminal-text);
      font-family:
        "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: var(--font-size);
      line-height: 1.45;
      outline: none;
    }

    .terminal-host .xterm {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
    }

    .pane-agent-terminal-host {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .pane-agent-terminal-host[hidden] {
      display: none;
    }

    .artifact-frame {
      background: var(--terminal);
      color-scheme: dark;
      opacity: 1;
      transition: opacity 80ms ease;
    }

    .artifact-frame.loading {
      opacity: 1;
    }

    .scratch-pad,
    .status-output,
    .input-text {
      padding: 10px 12px;
      resize: none;
      white-space: pre-wrap;
    }

    .status-output {
      margin: 0;
      overflow: auto;
    }

    .input-layout {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      grid-template-columns: minmax(0, 1fr) minmax(132px, 190px);
      height: 100%;
      min-height: 0;
      gap: 8px;
      padding: 8px;
    }

    .input-compose {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      gap: 8px;
    }

    .send-shortcut {
      min-width: 92px;
      min-height: 0;
      border: 1px solid #364156;
      border-radius: 8px;
      background: #1d2638;
      color: var(--terminal-text);
      cursor: crosshair;
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
      padding: 8px;
      white-space: normal;
    }

    .send-shortcut:hover,
    .send-shortcut.recording {
      border-color: #66d9e8;
      background: #183a50;
      color: #ffffff;
    }

    .send-shortcut.invalid {
      border-color: #ffb4a9;
      background: #4a242b;
    }

    .input-actions {
      display: grid;
      grid-template-rows: repeat(3, 42px);
      align-items: stretch;
      align-content: start;
      gap: 10px;
      border-left: 1px solid var(--border);
      background: #151b29;
      padding-left: 8px;
    }

    .input-actions button {
      height: 42px;
    }

    .input-actions .input-interrupt {
      border-color: #73342f;
      background: #3a1d1a;
      color: #ffb4a9;
    }

    .input-actions .input-link {
      border-color: #305e6f;
      background: #12303b;
      color: #d5f4ff;
    }

    .pane-content-control {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .pane-content-control label {
      color: #aab8cf;
      font-size: calc(var(--font-size) - 3px);
      font-weight: 750;
    }

    .pane-content-control select {
      width: clamp(130px, 22vw, 240px);
      min-width: 100px;
      min-height: 30px;
      border: 1px solid #364156;
      border-radius: 6px;
      background: #1d2638;
      color: var(--terminal-text);
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
    }

    .workspace-window {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      min-width: 0;
      min-height: 0;
    }

    .workspace-layout,
    .workspace-pane-root,
    .workspace-pane-split,
    .workspace-pane-leaf {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .workspace-layout {
      position: relative;
      overflow: hidden;
    }

    .workspace-pane-split {
      display: grid;
      overflow: hidden;
    }

    .workspace-pane-leaf {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      background: var(--terminal);
      container-type: inline-size;
    }

    .workspace-pane-toolbar {
      display: grid;
      grid-template-columns: minmax(76px, 1fr) 28px 28px 28px 28px;
      gap: 4px;
      align-items: center;
      min-width: 0;
      height: 32px;
      border-bottom: 1px solid var(--border);
      background: #151d2b;
      padding: 3px 5px;
    }

    .workspace-pane-kind {
      width: 100%;
      min-width: 0;
      height: 24px;
      border: 1px solid #364156;
      border-radius: 4px;
      background: #1d2638;
      color: var(--terminal-text);
      font: inherit;
      font-size: calc(var(--font-size) - 2px);
      padding: 0 5px;
    }

    .workspace-pane-command {
      position: relative;
      width: 28px;
      height: 24px;
      border: 1px solid #364156;
      border-radius: 4px;
      background: #1d2638;
      color: #d8e3f4;
      cursor: pointer;
      font: inherit;
      font-size: 16px;
      line-height: 1;
    }

    .workspace-pane-command:hover:not(:disabled) {
      border-color: #4e7f9d;
      background: #22314a;
    }

    .workspace-pane-command:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .workspace-pane-command.split-right::before,
    .workspace-pane-command.split-down::before {
      position: absolute;
      inset: 5px 6px;
      border: 1px solid currentcolor;
      border-radius: 1px;
      content: "";
    }

    .workspace-pane-command.split-right::after,
    .workspace-pane-command.split-down::after {
      position: absolute;
      background: currentcolor;
      content: "";
    }

    .workspace-pane-command.split-right::after {
      top: 5px;
      bottom: 5px;
      left: 13px;
      width: 1px;
    }

    .workspace-pane-command.split-down::after {
      right: 6px;
      bottom: 11px;
      left: 6px;
      height: 1px;
    }

    .workspace-pane-empty {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      color: #77849a;
      font-size: calc(var(--font-size) - 2px);
    }

    .workspace-pane-frame {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      background: var(--terminal);
    }

    .workspace-pane-divider {
      min-width: 0;
      min-height: 0;
      background: #253044;
      touch-action: none;
    }

    .workspace-pane-divider.row {
      cursor: col-resize;
    }

    .workspace-pane-divider.column {
      cursor: row-resize;
    }

    .workspace-pane-divider:hover,
    .workspace-pane-divider.resizing {
      background: #3a78a0;
    }

    .workspace-pane-corner {
      position: absolute;
      z-index: 9;
      width: 14px;
      height: 14px;
      border: 0;
      background: transparent;
      color: #60758d;
      cursor: nesw-resize;
      touch-action: none;
    }

    .workspace-pane-corner.top-right {
      top: 32px;
      right: 0;
    }

    .workspace-pane-corner.bottom-left {
      bottom: 0;
      left: 0;
    }

    .workspace-pane-corner::before {
      position: absolute;
      width: 7px;
      height: 7px;
      content: "";
    }

    .workspace-pane-corner.top-right::before {
      top: 2px;
      right: 2px;
      border-top: 2px solid currentcolor;
      border-right: 2px solid currentcolor;
    }

    .workspace-pane-corner.bottom-left::before {
      bottom: 2px;
      left: 2px;
      border-bottom: 2px solid currentcolor;
      border-left: 2px solid currentcolor;
    }

    .workspace-pane-corner:hover,
    .workspace-pane-leaf.splitting .workspace-pane-corner {
      color: #66d9e8;
    }

    .workspace-pane-split-preview {
      position: absolute;
      z-index: 8;
      border: 2px solid #66d9e8;
      background: rgb(31 111 139 / 24%);
      pointer-events: none;
    }

    .workspace-layout.pane-layout-ctrl-ready .workspace-pane-leaf::after {
      position: absolute;
      z-index: 30;
      inset: 32px 0 0;
      background: transparent;
      content: "";
      cursor: grab;
      pointer-events: auto;
    }

    .workspace-pane-leaf.pane-drag-source {
      outline: 2px solid #f0a43c;
      outline-offset: -2px;
    }

    .workspace-pane-toolbar[data-pane-drag-handle] {
      cursor: grab;
    }

    .workspace-pane-toolbar button,
    .workspace-pane-toolbar select {
      cursor: pointer;
    }

    .pane-drag-detach-target,
    .pane-drag-preview,
    .pane-drag-ghost {
      position: fixed;
      z-index: 4000;
      pointer-events: none;
    }

    .pane-drag-detach-target {
      top: 14px;
      left: 50%;
      min-width: 180px;
      border: 2px dashed #66d9e8;
      border-radius: 6px;
      background: rgb(18 30 49 / 96%);
      color: #d8f7fb;
      padding: 10px 18px;
      text-align: center;
      transform: translateX(-50%);
    }

    .pane-drag-preview {
      border: 2px solid #66d9e8;
      background: rgb(31 111 139 / 30%);
    }

    .pane-drag-preview[data-position="center"] {
      border-color: #f0a43c;
      background: rgb(240 164 60 / 22%);
    }

    .pane-drag-ghost {
      z-index: 4003;
      max-width: 220px;
      overflow: hidden;
      border: 1px solid #52647e;
      border-radius: 4px;
      background: rgb(21 29 43 / 94%);
      color: #eef5ff;
      padding: 6px 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.pane-dragging iframe {
      pointer-events: none;
    }

    body.workspace-splitting,
    body.pane-dragging {
      user-select: none;
    }

    @container (max-width: 180px) {
      .workspace-pane-toolbar {
        grid-template-columns: minmax(42px, 1fr) 24px 24px 24px;
        gap: 2px;
      }

      .workspace-pane-command {
        width: 24px;
      }

      .workspace-pane-command.reset-layout {
        display: none;
      }
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main id="workspaceWindow" class="workspace-window" hidden>
    <header class="pane-toolbar">
      <span id="workspaceTitle">ElectroBoy workspace</span>
      <div class="pane-actions">
        <button id="resetWorkspace" type="button">Reset layout</button>
        <button id="dockWorkspace" type="button">Dock window</button>
      </div>
    </header>
    <section id="workspaceLayout" class="workspace-layout"></section>
  </main>
  <main id="directPaneWindow" class="pane-window">
    <header class="pane-toolbar">
      <span id="paneTitle">Pane</span>
      <div class="pane-actions">
        <div id="paneContentControl" class="pane-content-control" hidden>
          <label id="paneContentLabel" for="contentSwitcher">Content</label>
          <select
            id="contentSwitcher"
            aria-label="Select pane content"
            disabled
          ></select>
        </div>
        <div id="paneFontControls" class="pane-font-controls" aria-label="Pane font size">
          <button
            id="decreasePaneFont"
            type="button"
            title="Decrease pane font size"
            aria-label="Decrease pane font size"
          >A-</button>
          <span id="paneFontLevel" class="pane-font-level">15px</span>
          <button
            id="resetPaneFont"
            type="button"
            title="Reset pane font size"
            aria-label="Reset pane font size"
          >0</button>
          <button
            id="increasePaneFont"
            type="button"
            title="Increase pane font size"
            aria-label="Increase pane font size"
          >A+</button>
        </div>
        <div id="artifactZoomControls" class="artifact-zoom-controls" hidden>
          <button
            id="decreaseArtifactZoom"
            type="button"
            title="Zoom document out"
            aria-label="Zoom document out"
          >-</button>
          <span id="artifactZoomLevel" class="artifact-zoom-level">100%</span>
          <button
            id="increaseArtifactZoom"
            type="button"
            title="Zoom document in"
            aria-label="Zoom document in"
          >+</button>
        </div>
        <button
          id="refreshArtifact"
          type="button"
          title="Refresh document"
          aria-label="Refresh document"
          hidden
        >Refresh</button>
        <button
          id="previewArtifact"
          type="button"
          title="Preview document"
          aria-label="Preview document"
          hidden
        >Preview</button>
        <button
          id="editArtifact"
          type="button"
          title="Edit document"
          aria-label="Edit document"
          hidden
        >Edit</button>
        <select
          id="exportPaneFormat"
          title="Export format"
          aria-label="Export format"
          hidden
        >
          <option value="markdown">Markdown</option>
          <option value="docx">DOCX</option>
          <option value="pdf">PDF</option>
        </select>
        <button
          id="exportPaneOutput"
          type="button"
          title="Export pane output or document"
          aria-label="Export pane output or document"
          hidden
        >Export</button>
        <button id="dockPane" type="button">Dock</button>
      </div>
    </header>
    <section id="paneBody" class="pane-body">
      <div id="paneContentSurface" class="pane-content-surface">
        <div id="terminalHost" class="terminal-host" hidden></div>
      <iframe
        id="artifactFrame"
        class="artifact-frame"
        title="Rendered pane content"
        sandbox="allow-scripts allow-popups allow-modals allow-same-origin"
        hidden
      ></iframe>
      <textarea id="scratchPad" class="scratch-pad" spellcheck="true" hidden></textarea>
      <pre id="statusOutput" class="status-output" hidden></pre>
        <div id="inputLayout" class="input-layout" hidden>
          <div class="input-compose">
            <textarea id="agentInput" class="input-text" spellcheck="true"></textarea>
          </div>
          <div class="input-actions">
            <button id="interruptAgent" class="input-interrupt" type="button">
              Interrupt
            </button>
            <button id="linkAgentFile" class="input-link" type="button">
              Link file
            </button>
            <button
              id="agentSendShortcut"
              class="send-shortcut"
              type="button"
              title="Hover to record the send-message shortcut"
              aria-label="Hover to record the send-message shortcut"
            >Shift+Enter</button>
          </div>
        </div>
      </div>
      <button
        id="paneToolsToggle"
        class="pane-tools-toggle"
        type="button"
        aria-controls="paneToolsShelf"
        aria-expanded="false"
        hidden
      >Tools</button>
      <aside id="paneToolsShelf" class="pane-tools-shelf" aria-label="Pane tools" hidden>
        <div id="paneToolsResizeHandle" class="pane-tools-resize-handle"></div>
        <header class="pane-tools-header">
          <span id="paneToolsTitle">Tools</span>
          <button id="closePaneTools" type="button" aria-label="Close pane tools">×</button>
        </header>
        <div id="paneToolsContent" class="pane-tools-content"></div>
      </aside>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="/assets/service/js/core/terminal-behavior.js"></script>
  <script src="/assets/service/js/core/pane-layout-drag.js"></script>
  <script src="/assets/service/js/core/split-resize.js"></script>
  <script src="/assets/service/js/core/pane-workspace.js"></script>
  <script src="/assets/service/js/core/input-shortcut.js"></script>
  <script src="/assets/service/js/core/pane-sync.js"></script>
  <script src="/assets/service/js/core/pane-tools.js"></script>
  <script src="/assets/service/js/modules/file-pane-tools.js"></script>
  <script src="/assets/service/js/modules/agenda-pane-tools.js"></script>
  <script>

      if (kind === "shell") return "shell";

    function storedBaseFontSize() {
      const requested = Number(
        params.get("base_font_size") || params.get("font_size") || "",
      );
      if (Number.isFinite(requested) && requested > 0) {
        return clampFontSize(requested);
      }
      try {
        const stored = Number(window.localStorage.getItem(TERMINAL_FONT_STORAGE_KEY));
        if (Number.isFinite(stored) && stored > 0) {
          return clampFontSize(stored);
        }
      } catch (error) {
        return DEFAULT_FONT_SIZE;
      }
      return DEFAULT_FONT_SIZE;
    }

    function storedFontOffset() {
      if (params.has("font_offset")) {
        const requested = Number(params.get("font_offset") || "");
        if (Number.isFinite(requested)) {
          return clampFontOffset(requested);
        }
      }
      return localStoredFontOffset();
    }

    function localStoredFontOffset() {
      try {
        const stored = Number(
          window.localStorage.getItem(PANE_FONT_OFFSET_STORAGE_PREFIX + fontPane),
        );
        if (Number.isFinite(stored)) {
          return clampFontOffset(stored);
        }
      } catch (error) {
        return 0;
      }
      return 0;
    }

    function clampFontSize(value) {
      return Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, Math.round(value)));
    }

    function clampFontOffset(value) {
      return Math.max(MIN_FONT_OFFSET, Math.min(MAX_FONT_OFFSET, Math.round(value)));
    }

    function effectiveFontSize() {
      return clampFontSize(baseFontSize + fontOffset);
    }

    function saveFontOffset() {
      try {
        window.localStorage.setItem(
          PANE_FONT_OFFSET_STORAGE_PREFIX + fontPane,
          String(fontOffset),
        );
      } catch (error) {
        return;
      }
    }

    function notifyFontOffsetChanged() {
      if (window.opener) {
        window.opener.postMessage(
          {
            type: "electroboy-pane-font-offset",
            pane: fontPane,
            offset: fontOffset,
          },
          window.location.origin,
        );
      }
    }

    function applyFontSize() {

        ? "Global font size"
        : `Global ${fontOffset > 0 ? "+" : ""}${fontOffset}px`;
      decreasePaneFont.disabled = fontOffset <= MIN_FONT_OFFSET;
      resetPaneFont.disabled = fontOffset === 0;
      increasePaneFont.disabled = fontOffset >= MAX_FONT_OFFSET;
    }

    function changeFontSize(delta) {
      fontOffset = clampFontOffset(fontOffset + delta);
      saveFontOffset();
      applyFontSize();
      notifyFontOffsetChanged();

    function contextUrl(path) {
      const separator = path.includes("?") ? "&" : "?";
      const context = new URLSearchParams();
      context.set("context_id", contextId);
      context.set("workspace_id", workspaceId);
      context.set("connection_id", connectionId);
      if (leaseToken) {
        context.set("lease_token", leaseToken);
      }
      if (telemetryPageId) {
        context.set("telemetry_page_id", telemetryPageId);
      }
      if (telemetryTabId) {
        context.set("telemetry_tab_id", telemetryTabId);
      }
      return `${path}${separator}${context.toString()}`;
    }

    function shellContextUrl(path) {
      const url = new URL(contextUrl(path), window.location.origin);
      if (selectedShellSessionId) {
        url.searchParams.set("session_id", selectedShellSessionId);

      return `${url.pathname}${url.search}`;

        .json()
        .catch(() => ({ error: "project load failed" }));
      if (!response.ok) {
        throw new Error(payload.error || "project load failed");
      }
      return payload;

    function applyAgentStartPayload(payload) {
      if (!payload || typeof payload !== "object") {
        return;

      if (Array.isArray(payload.sessions)) {
        agentSessions = payload.sessions;

      activeProjectRoot = payload.active_project_root || payload.activation_root
        || payload.service_root || activeProjectRoot;
      selectedSessionId = payload.session_id || payload.selected_session_id
        || selectedSessionId;
      if (PANE_KIND === "agent") {
        renderSessionSwitcher();
        connectAgentStream();
      }
    }

        type: "document",
        path,
        label: String(target.title || path),

    function paneCreativeSessionQuery(activeTarget) {
      const params = new URLSearchParams();
      params.set("scope", "document");
      params.set("active_document", activeTarget.path);
      params.set("target_type", activeTarget.type);
      params.set("target_path", activeTarget.path);
      return params.toString();
    }

    function paneCreativeSessionDate(session) {
      const value = String(session.updated_at || session.created_at || "");
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? value : parsed.toLocaleString();
    }

    function paneCreativeSessionOptionValue(session) {
      const status = String(session.status || "");
      const providerId = String(session.provider_session_id || "");
      const serviceId = String(
        session.electroboy_session_id || session.session_id || "",
      );
      if (status === "running" && serviceId) {
        return `service:${serviceId}`;
      }
      if (providerId) {
        return `provider:${providerId}`;
      }
      return serviceId ? `service:${serviceId}` : "";
    }

    function paneCreativeSessionChoice(value, customInput) {
      if (value === "custom") {
        const manualId = customInput.value.trim();
        return manualId ? { sessionId: manualId, startNew: false } : null;
      }
      if (value.startsWith("provider:")) {
        return {
          providerSessionId: value.slice("provider:".length),
          startNew: false,
        };
      }
      if (value.startsWith("service:")) {
        return {
          sessionId: value.slice("service:".length),
          startNew: false,
        };
      }
      return { startNew: true };
    }

    async function choosePaneCreativeAgentSession(activeTarget) {
      const query = paneCreativeSessionQuery(activeTarget);
      const response = await fetch(
        contextUrl(`/api/creative/agent/sessions?${query}`),
        { cache: "no-store" },
      );
      const payload = await response.json().catch(() => ({
        error: "session history failed",
      }));
      if (!response.ok) {
        throw new Error(payload.error || "session history failed");
      }
      const dialog = ensurePaneCreativeSessionDialog();
      const heading = dialog.querySelector(".pane-session-header h2");
      const summary = dialog.querySelector(".pane-session-header p");
      const list = dialog.querySelector(".pane-session-list");
      const customInput = dialog.querySelector(".pane-session-id");
      const customRadio = dialog.querySelector('input[value="custom"]');
      const error = dialog.querySelector(".pane-session-error");
      const submit = dialog.querySelector(".pane-session-submit");
      const newOption = document.createElement("label");
      newOption.className = "pane-session-option";
      newOption.innerHTML = `
        <input type="radio" name="pane-creative-session" value="" checked>
        <span class="pane-session-option-copy">
          <strong>New session</strong>
          <span class="pane-session-details">
            Start with a clean creative context.
          </span>
        </span>
      `;
      const sessions = Array.isArray(payload.sessions) ? payload.sessions : [];
      heading.textContent = "Start document agent";
      summary.textContent = payload.document_path
        ? `Sessions scoped to ${payload.document_path}.`
        : `Sessions scoped to ${activeTarget.path}.`;
      list.replaceChildren(
        newOption,
        ...sessions.map((session, index) =>
          paneCreativeSessionOption(session, index),
        ),
      );
      customInput.value = "";
      error.hidden = true;
      submit.textContent = "Start";
      dialog.querySelector(".pane-session-options").onchange = (event) => {
        if (event.target.name !== "pane-creative-session") {
          return;
        }
        submit.textContent = event.target.value ? "Resume" : "Start";
        error.hidden = true;
      };
      customInput.onfocus = () => {
        customRadio.checked = true;
        submit.textContent = "Resume";
        error.hidden = true;
      };

      return new Promise((resolve) => {
        const finish = (choice) => {
          dialog.close();
          resolve(choice);
        };
        dialog.querySelector(".pane-session-close").onclick = () => {
          finish(null);
        };
        dialog.querySelector(".pane-session-cancel").onclick = () => {
          finish(null);
        };
        dialog.oncancel = (event) => {
          event.preventDefault();
          finish(null);
        };
        dialog.querySelector("form").onsubmit = (event) => {
          event.preventDefault();
          const selected = dialog.querySelector(
            'input[name="pane-creative-session"]:checked',
          );
          const choice = paneCreativeSessionChoice(
            selected ? selected.value : "",
            customInput,
          );
          if (!choice) {
            error.textContent = "Enter a session id.";
            error.hidden = false;
            return;
          }
          finish(choice);
        };
        dialog.showModal();
      });
    }

    async function startPaneDocumentAgent(target) {
      const activeTarget = paneDocumentAgentPayload(target);
      const project = await loadProjectPayload();
      const isCreativeProject = project.project_mode === "creative";
      const choice = isCreativeProject
        ? await choosePaneCreativeAgentSession(activeTarget)
        : null;
      if (isCreativeProject && !choice) {
        return null;
      }
      const endpoint = isCreativeProject
        ? "/api/creative/agent/start"
        : "/api/agents/documentation/start";
      const body = isCreativeProject
        ? {
            active_document: activeTarget.path,
            active_target: activeTarget,
            scope: "document",
            session_id: choice.sessionId || "",
            provider_session_id: choice.providerSessionId || "",
            start_new: Boolean(choice.startNew),
          }
        : { target: activeTarget.path };
      const response = await fetch(contextUrl(endpoint), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const payload = await response.json().catch(() => ({ error: "start failed" }));
      if (!response.ok) {
        throw new Error(payload.error || "start failed");
      }
      applyAgentStartPayload(payload);
      return payload;
    }

    function updateSelectOptions(select, options, value = "", disabled = false) {
      const normalizedOptions = options.map((option) => ({
        value: String(option.value || ""),
        label: String(option.label || ""),
        disabled: Boolean(option.disabled),
      }));
      const signature = JSON.stringify(
        normalizedOptions.map((option) => [option.value, option.disabled]),
      );
      if (select.dataset.optionSignature !== signature) {
        select.replaceChildren();
        for (const option of normalizedOptions) {
          const element = document.createElement("option");
          element.value = option.value;
          element.textContent = option.label;
          element.disabled = option.disabled;
          select.append(element);
        }
        select.dataset.optionSignature = signature;
      } else {
        const elements = Array.from(select.options);
        normalizedOptions.forEach((option, index) => {
          const element = elements[index];
          if (!element) {
            return;
          }
          if (element.textContent !== option.label) {
            element.textContent = option.label;
          }
          element.disabled = option.disabled;
        });
      }
      const nextValue = String(value || "");
      if (select.value !== nextValue) {
        select.value = nextValue;
      }
      select.disabled = Boolean(disabled);
    }

    function renderSessionSwitcher() {
      const visibleSessions = PANE_KIND === "agent"
        ? agentSessions
        : agentSessions.filter(
          (session) => session.status === "running" ||
            session.session_id === selectedSessionId,
        );
      if (visibleSessions.length === 0) {
        selectedSessionId = "";
        updateSelectOptions(
          contentSwitcher,
          [{ value: "", label: "No active agents" }],
          "",
          true,
        );
        return;
      }
      if (!agentSessions.some((session) => session.session_id === selectedSessionId)) {
        const selected = visibleSessions.find((session) => session.selected) || visibleSessions[0];
        selectedSessionId = selected ? selected.session_id : "";
      }
      updateSelectOptions(
        contentSwitcher,
        visibleSessions.map((session) => {
          const status = session.status === "running" ? "running" : session.status || "done";
          return {
            value: session.session_id,
            label: `${session.kind || "agent"} · ${status}`,
          };
        }),
        selectedSessionId,
        false,
      );
    }

    function selectedAgentSession() {
      return agentSessions.find((session) => session.session_id === selectedSessionId)
        || null;
    }

    function renderFileSwitcher() {
      const placeholderLabel = fileSwitcherPlaceholderLabel();
      const options = [{
        value: "",
        label: placeholderLabel || "Choose file",
      }];
      if (placeholderLabel) {
        options[0].label = placeholderLabel;
      }
      const files = [...openFileTargets];
      if (
        artifactKind === "document"
        && artifactDocumentPath
        && !files.some((file) => file.path === artifactDocumentPath)
      ) {
        files.unshift({
          path: artifactDocumentPath,
          label: artifactDocumentTitle || artifactDocumentPath,
        });
      }
      if (files.length === 0) {
        if (!placeholderLabel) {
          options[0].label = "No open files";
        }
        updateSelectOptions(contentSwitcher, options, "", true);
        return;
      }
      files.forEach((file) => {
        options.push({
          value: file.path,
          label: file.label || file.path,
        });
      });
      updateSelectOptions(
        contentSwitcher,
        options,
        artifactKind === "document" ? artifactDocumentPath : "",
        false,
      );
      if (artifactKind === "document" && files.length > 0 && !contentSwitcher.value) {
        selectFileTarget(files[0]);
      }
    }

      if (artifactKind === "corkboard" || artifactKind === "creative-corkboard") {
