[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electroboy-workflow-software"
version = "0.1.0"
description = "Software-engineering workflow for ElectroBoy."
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
  "electroboy-core==0.1.0",
  "electroboy-modules==0.1.0",
]

[project.entry-points."electroboy.workflows"]
software = "electroboy.workflows.software.plugin:workflow"

[tool.setuptools]
package-dir = { "" = "../../src" }
packages = ["electroboy.workflows.software"]
include-package-data = false

[tool.setuptools.package-data]
"electroboy.workflows.software" = ["assets/*.js"]
